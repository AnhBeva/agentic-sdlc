<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic SDLC — Operating System Portal</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Cổng thông tin quy trình Agentic SDLC - Cẩm nang thiết kế, vận hành, kiểm soát chất lượng và tự cải thiện cho AI Coding Agents và AI nghiệp vụ.">
  <meta name="keywords" content="Agentic SDLC, AI Agent, Software Development Life Cycle, Software Engineering, Observability, OWASP Agentic, DevOps, CI/CD">
  <meta name="author" content="AnhBeva">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  <!-- Markdown, Code Highlighting & Diagrams Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- Prism JS for beautiful Apple-style code highlighting -->
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

  <!-- Mermaid.js for flowcharts, diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>

  <style>
    /* Design Tokens - Clean Premium Apple Light Theme */
    :root {
      --bg-main: #f5f5f7;
      --bg-card: #ffffff;
      --bg-sidebar: rgba(245, 245, 247, 0.88);
      --border-color: rgba(0, 0, 0, 0.08);
      --text-primary: #1d1d1f;
      --text-secondary: #86868b;
      --text-body: #333336;
      --accent: #0066cc;
      --accent-hover: #0077ed;
      --accent-soft: #e8f2fc;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 12px 30px rgba(0, 0, 0, 0.09);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      --font-heading: 'Outfit', -apple-system, sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'Fira Code', monospace;
    }

    /* CSS Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-main);
      color: var(--text-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Main Layout */
    .app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* Sidebar Styling */
    .sidebar {
      width: 320px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-shrink: 0;
      z-index: 100;
      transition: var(--transition);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0066cc, #54a0ff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 4px 10px rgba(0, 102, 204, 0.2);
    }

    .logo-title {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .search-wrapper {
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      background-color: rgba(0, 0, 0, 0.04);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--text-primary);
      transition: var(--transition);
    }

    .search-input:focus {
      outline: none;
      background-color: var(--bg-card);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.12);
    }

    .search-icon-wrapper {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
      width: 16px;
      height: 16px;
    }

    /* Sidebar Nav List */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
    }

    .nav-category {
      margin-bottom: 24px;
    }

    .category-title {
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding-left: 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .nav-item-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      color: var(--text-body);
      font-family: var(--font-body);
      font-size: 13.5px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: var(--transition);
      overflow: hidden;
    }

    .nav-item-btn:hover {
      background-color: rgba(0, 0, 0, 0.04);
      color: var(--text-primary);
    }

    .nav-item-btn.active {
      background-color: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      position: relative;
    }

    .nav-item-btn.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 3px;
      background-color: var(--accent);
      border-radius: 0 4px 4px 0;
    }

    .nav-icon {
      color: var(--text-secondary);
      transition: var(--transition);
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nav-item-btn.active .nav-icon {
      color: var(--accent);
    }

    /* Subcategory Hierarchical Tree Styling */
    .subcategory-wrapper {
      margin-bottom: 2px;
    }
    
    .nav-subcat-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      color: var(--text-body);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      text-align: left;
    }
    
    .nav-subcat-btn:hover {
      background-color: rgba(0, 0, 0, 0.04);
      color: var(--text-primary);
    }
    
    .subcat-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 2px;
      margin-bottom: 6px;
    }
    
    .nav-item-btn.indent {
      padding-left: 28px;
      font-size: 13px;
    }
    
    .subcat-count {
      font-size: 10px;
      background-color: rgba(0, 0, 0, 0.05);
      color: var(--text-secondary);
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 600;
    }
    
    .nav-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-grow: 1;
    }

    /* Main Area Styling */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: var(--bg-card);
      overflow: hidden;
      position: relative;
    }

    /* Top Bar Header */
    .topbar {
      height: 64px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      background-color: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 50;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .menu-toggle-btn {
      display: none;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-primary);
      width: 24px;
      height: 24px;
    }

    .breadcrumbs {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .breadcrumb-sep {
      color: #d2d2d7;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-body);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .action-btn:hover {
      background-color: var(--bg-main);
      border-color: #d2d2d7;
      color: var(--text-primary);
    }

    /* Document Layout */
    .document-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      width: 100%;
    }

    .content-container {
      flex: 1;
      overflow-y: auto;
      padding: 48px;
      scroll-behavior: smooth;
    }

    .article-wrapper {
      max-width: 800px;
      margin: 0 auto;
    }

    /* Table of Contents */
    .toc-wrapper {
      width: 260px;
      border-left: 1px solid var(--border-color);
      padding: 32px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-shrink: 0;
    }

    .toc-title {
      font-family: var(--font-heading);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .toc-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toc-link {
      font-size: 13px;
      color: var(--text-body);
      text-decoration: none;
      transition: var(--transition);
      cursor: pointer;
      display: block;
      border-left: 2px solid transparent;
      padding-left: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toc-link:hover {
      color: var(--accent);
    }

    .toc-link.active {
      color: var(--accent);
      font-weight: 600;
      border-left-color: var(--accent);
    }

    .toc-link.indent-h3 {
      padding-left: 20px;
    }

    /* Dynamic Cockpit Dashboard styles */
    .dashboard-container {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding-bottom: 60px;
    }

    .dashboard-hero {
      background: linear-gradient(135deg, #ffffff, #f5f5f7);
      border: 1px solid var(--border-color);
      padding: 48px;
      border-radius: var(--radius-lg);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .dashboard-hero::after {
      content: '';
      position: absolute;
      top: -150px;
      right: -150px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 102, 204, 0.05) 0%, rgba(255,255,255,0) 70%);
      pointer-events: none;
    }

    .dashboard-hero h1 {
      font-family: var(--font-heading);
      font-size: 34px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
      letter-spacing: -0.8px;
    }

    .dashboard-hero p {
      font-size: 15.5px;
      color: var(--text-secondary);
      max-width: 600px;
      line-height: 1.5;
    }

    .dashboard-section-title {
      font-family: var(--font-heading);
      font-size: 19px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.3px;
    }

    /* Card Grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
    }

    .metric-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .metric-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent);
    }

    .metric-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .metric-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background-color: var(--bg-main);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .metric-count {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .metric-title {
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .metric-desc {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    /* Interactive Phase Timeline Flow */
    .phase-timeline-container {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: var(--bg-card);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .phase-steps-bar {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
      background-color: #fafafc;
    }

    .phase-step-btn {
      flex: 1;
      min-width: 110px;
      padding: 16px 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      border-right: 1px solid var(--border-color);
    }

    .phase-step-btn:last-child {
      border-right: none;
    }

    .phase-step-btn:hover {
      background-color: rgba(0, 0, 0, 0.02);
    }

    .phase-step-btn.active {
      background-color: var(--bg-card);
      box-shadow: inset 0 -3px 0 0 var(--accent);
    }

    .phase-number {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      transition: var(--transition);
    }

    .phase-step-btn.active .phase-number {
      background-color: var(--accent);
      color: white;
    }

    .phase-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-align: center;
      white-space: nowrap;
    }

    .phase-step-btn.active .phase-name {
      color: var(--accent);
      font-weight: 700;
    }

    .phase-content-panel {
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: #ffffff;
    }

    .phase-panel-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .phase-panel-title {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .phase-panel-desc {
      font-size: 13.5px;
      color: var(--text-secondary);
    }

    .phase-links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }

    .phase-links-column {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 16px;
      background-color: #fafafc;
    }

    .column-title {
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .column-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      list-style: none;
    }

    .inline-link-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 8px;
      border-radius: 4px;
      transition: var(--transition);
      background-color: transparent;
      border: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
    }

    .inline-link-btn:hover {
      background-color: var(--accent-soft);
    }

    .empty-state-text {
      font-size: 13px;
      color: var(--text-secondary);
      font-style: italic;
      padding-left: 8px;
    }

    /* Decision Helper Matrix */
    .decision-helper-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .decision-row {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .decision-row:hover {
      border-color: rgba(0, 102, 204, 0.4);
    }

    .decision-header {
      width: 100%;
      padding: 18px 24px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
    }

    .decision-header-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .decision-title {
      font-family: var(--font-heading);
      font-size: 15.5px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .decision-subtitle {
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .decision-body {
      display: none;
      padding: 0 24px 24px 24px;
      border-top: 1px solid var(--border-color);
      background-color: #fafafc;
      flex-direction: column;
      gap: 16px;
    }

    .decision-resources-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 8px;
    }

    .decision-arrow {
      width: 16px;
      height: 16px;
      color: var(--text-secondary);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .decision-row.open .decision-arrow {
      transform: rotate(90deg);
      color: var(--accent);
    }

    .decision-row.open .decision-body {
      display: flex;
    }

    /* Markdown styling (Apple style) */
    .markdown-body {
      font-family: var(--font-body);
      font-size: 15.5px;
      color: var(--text-body);
      line-height: 1.7;
      display: none;
    }

    .markdown-body h1 {
      font-family: var(--font-heading);
      font-size: 30px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 24px;
      letter-spacing: -0.8px;
      line-height: 1.25;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .markdown-body h2 {
      font-family: var(--font-heading);
      font-size: 21px;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 40px;
      margin-bottom: 16px;
      letter-spacing: -0.4px;
      line-height: 1.3;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      padding-bottom: 8px;
    }

    .markdown-body h3 {
      font-family: var(--font-heading);
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 24px;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .markdown-body p {
      margin-bottom: 20px;
    }

    .markdown-body a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid transparent;
      transition: var(--transition);
    }

    .markdown-body a:hover {
      border-bottom-color: var(--accent);
    }

    /* Lists styling */
    .markdown-body ul, .markdown-body ol {
      margin-bottom: 20px;
      padding-left: 24px;
    }

    .markdown-body li {
      margin-bottom: 8px;
    }

    .markdown-body li > ul, .markdown-body li > ol {
      margin-top: 8px;
      margin-bottom: 0;
    }

    /* checklists */
    .markdown-body ul li input[type="checkbox"] {
      margin-right: 8px;
      accent-color: var(--accent);
      transform: scale(1.1);
      vertical-align: middle;
      position: relative;
      top: -1px;
    }

    /* Blockquotes */

      color: var(--text-body);

      margin-bottom: 28px;
      font-size: 14px;
      box-shadow: var(--shadow-sm);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border-color);

      padding: 12px 16px;
      text-align: left;

      background-color: var(--bg-main);
      color: var(--text-primary);
      font-weight: 600;
      border-bottom: 2px solid var(--border-color);

      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-card);

      border-bottom: none;
    }

      background-color: #fafafc;
    }

    .markdown-body code {
      font-family: var(--font-mono);
      font-size: 13.5px;
      background-color: var(--bg-main);
      padding: 3px 6px;
      border-radius: 4px;
      color: #bf3434;
    }

      background-color: #1e1e24;
      padding: 18px;
      border-radius: var(--radius-md);
      overflow-x: auto;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;

      background-color: transparent;
      padding: 0;
      color: #e5c07b;
      font-size: 13px;
    }

    .custom-alert {
      margin-bottom: 24px;
      border-radius: var(--radius-md);
      padding: 16px 20px;
      border-left: 4px solid transparent;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: var(--shadow-sm);

      display: flex;
      align-items: center;

      text-transform: uppercase;
      letter-spacing: 0.5px;

      font-size: 14px;

    .alert-important {

      border-left-color: #af52de;
    }

      color: #af52de;

    .alert-warning {

    // Clipboard copy helper
    function copyToClipboard(btn) {
      const pre = btn.closest('pre');
      const code = pre.querySelector('code').innerText;
      navigator.clipboard.writeText(code).then(() => {
        btn.innerHTML = SVGS.check;
        setTimeout(() => {

        }, 2000);
      });
    }

    // Path normalization helper for links
    function resolveRelativePath(basePath, relativePath) {
      if (relativePath.startsWith('http') || relativePath.startsWith('#')) {
        return relativePath;
      }
      const baseParts = basePath.split('/');
      baseParts.pop(); // remove filename
      const relParts = relativePath.split('/');
      for (const part of relParts) {
        if (part === '.') {
          continue;
        } else if (part === '..') {
          if (baseParts.length > 0) baseParts.pop();
        } else {
          baseParts.push(part);
        }
      }
      return baseParts.join('/');
    }

    function resolveDocId(href) {
      const currentDoc = docs.find(d => d.id === currentDocId);
      if (!currentDoc) return null;
      
      const resolvedPath = resolveRelativePath(currentDoc.path, href);
      if (pathMap[resolvedPath]) {
        return pathMap[resolvedPath];
      }
      let cleanPath = href.replace(/^(\.\.\/|\.\/)+/, '');
      if (pathMap[cleanPath]) {
        return pathMap[cleanPath];
      }
      const base = cleanPath.split('/').pop();
      if (pathMap[base]) {
        return pathMap[base];
      }
      return null;
    }

    // Search Diacritic remover for Vietnamese search
    function removeDiacritics(str) {
      return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    // Custom GitHub-style Alert Parser
    function parseAlerts(html) {
      const alertClasses = {
        'NOTE': 'alert-note',
        'TIP': 'alert-tip',
        'IMPORTANT': 'alert-important',
        'WARNING': 'alert-warning',
        'CAUTION': 'alert-caution'
      };
      const alertTitles = {
        'NOTE': 'Lưu ý',
        'TIP': 'Gợi ý',
        'IMPORTANT': 'Quan trọng',
        'WARNING': 'Cảnh báo',
        'CAUTION': 'Thận trọng'
      };
      const alertIcons = {
        'NOTE': `<span class="icon-wrapper" style="margin-right: 8px; color: #0066cc; width:16px; height:16px; display:inline-block; vertical-align:middle;">${SVGS.chevronRight}</span>`,
        'TIP': `<span class="icon-wrapper" style="margin-right: 8px; color: #34c759; width:16px; height:16px; display:inline-block; vertical-align:middle;">${SVGS.check}</span>`,
        'IMPORTANT': `<span class="icon-wrapper" style="margin-right: 8px; color: #af52de; width:16px; height:16px; display:inline-block; vertical-align:middle;">${SVGS.chevronRight}</span>`,
        'WARNING': `<span class="icon-wrapper" style="margin-right: 8px; color: #ff9500; width:16px; height:16px; display:inline-block; vertical-align:middle;">${SVGS.chevronRight}</span>`,
        'CAUTION': `<span class="icon-wrapper" style="margin-right: 8px; color: #ff3b30; width:16px; height:16px; display:inline-block; vertical-align:middle;">${SVGS.chevronRight}</span>`
      };
      
      return html.replace(/<blockquote>\s*<p>\s*\\?\[\!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(?:<br\s*\/?>)?([\s\S]*?)<\/p>\s*<\/blockquote>/gi, (match, type, content) => {
        type = type.toUpperCase();
        return `<div class="custom-alert ${alertClasses[type]}">
          <div class="custom-alert-header">
            ${alertIcons[type]}
            <span class="custom-alert-title">${alertTitles[type]}</span>
          </div>
          <div class="custom-alert-content">${content}</div>
        </div>`;
      });
    }

    // Unicode-aware header slugify matching GitHub behavior
    function githubSlugify(text) {
      if (!text) return "";
      let slug = text.toLowerCase().trim();
      slug = slug.replace(/[\*\_`]/g, '');
      // Unicode flag 'u' allows \p{L} for letters, \p{N} for numbers
      slug = slug.replace(/[^\p{L}\p{N}\-_\s]/gu, '');
      slug = slug.replace(/\s+/g, '-');
      slug = slug.replace(/^-+|-+$/g, '');
      return slug;
    }

    // Handle Article Selection
    async function loadDocument(id, anchor) {
      const doc = docs.find(d => d.id === id);
      if (!doc) return;
      
      currentDocId = id;
      document.title = `${doc.title} — Agentic SDLC Portal`;

      // Update Navigation State
      document.querySelectorAll('.nav-item-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-id') === id);
      });
      dashboardNavBtn.classList.remove('active');
      expandSubcategoryOfDoc(id);

      // Show TOC wrapper
      document.getElementById('toc-wrapper').style.display = 'block';

      // Update Breadcrumbs
      breadcrumbs.innerHTML = `
        <span>${doc.category}</span>
        <span class="breadcrumb-sep">&gt;</span>
        <span style="color: var(--text-primary); font-weight: 500;">${doc.path.split('/').pop()}</span>
      `;

      // Toggle views visibility
      dashboardView.style.display = 'none';
      searchResults.style.display = 'none';
      documentContent.style.display = 'block';

      // Parse Markdown to HTML
      let html = marked.parse(doc.content);
      
      // Parse Custom Alerts (GitHub style)
      html = parseAlerts(html);

      // Render HTML Content
      documentContent.innerHTML = html;

      // Highlight code blocks
      Prism.highlightAllUnder(documentContent);

      // Render Mermaid Diagrams
      try {
        await mermaid.run({
          querySelector: '.mermaid'
        });
      } catch (err) {
        console.error("Mermaid parsing error:", err);
      }

      // Build Table of Contents
      buildTOC();

      // Intercept and resolve cross links inside documentContent
      documentContent.querySelectorAll('a').forEach(a => {
        const href = a.getAttribute('href');
        if (href && !href.startsWith('http') && !href.startsWith('#')) {
          const mdLinkRegex = /^([^?#]+\.md)(?:#([^#]+))?$/;
          const match = href.match(mdLinkRegex);
          if (match) {
            const filePath = match[1];
            const linkAnchor = match[2] || '';
            const resolved = resolveDocId(filePath);
            if (resolved) {
              const hashNav = `${resolved}` + (linkAnchor ? `:${linkAnchor}` : '');
              a.setAttribute('href', `#${hashNav}`);
              a.onclick = function(e) {
                e.preventDefault();
                navigateTo(resolved, linkAnchor);
              };
            }
          }
        }
      });

      // Handle scrolling to anchor or resetting scroll
      if (anchor) {
        setTimeout(() => {
          const targetEl = document.getElementById(anchor);
          if (targetEl) {
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
          } else {
            // Check if there is an element with matching slugified ID
            const slugAnchor = githubSlugify(anchor);
            const targetElSlug = document.getElementById(slugAnchor);
            if (targetElSlug) {
              targetElSlug.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else {
              document.getElementById('content-container').scrollTop = 0;
            }
          }
        }, 150);
      } else {
        document.getElementById('content-container').scrollTop = 0;
      }
    }

    // Dynamic TOC builder
    function buildTOC() {
      const headings = documentContent.querySelectorAll('h2, h3');
      if (headings.length === 0) {
        tocList.innerHTML = '<li><span class="toc-link" style="color: var(--text-secondary); cursor: default;">Không có mục lục</span></li>';
        return;
      }

      let tocHtml = "";
      headings.forEach((heading) => {
        const text = heading.textContent;
        const tag = heading.tagName.toLowerCase();
        
        // Use standard slugification rules to generate valid DOM IDs
        const headingId = githubSlugify(text);
        heading.setAttribute('id', headingId);

        tocHtml += `
          <li>
            <a class="toc-link ${tag === 'h3' ? 'indent-h3' : ''}" data-target="${headingId}" onclick="scrollToHeading('${headingId}')">
              ${text}
            </a>
          </li>
        `;
      });
      
      tocList.innerHTML = tocHtml;
      setupTOCScrollSpy();
    }

    function scrollToHeading(id) {
      const el = document.getElementById(id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function setupTOCScrollSpy() {
      const headings = Array.from(documentContent.querySelectorAll('h2, h3'));
      const tocLinks = Array.from(document.querySelectorAll('.toc-link'));
      const container = document.getElementById('content-container');
      
      container.onscroll = () => {
        let activeId = "";
        const scrollPos = container.scrollTop + 100;
        
        for (const heading of headings) {
          if (heading.offsetTop <= scrollPos) {
            activeId = heading.getAttribute('id');
          } else {
            break;
          }
        }
        
        tocLinks.forEach(link => {
          const target = link.getAttribute('data-target');
          link.classList.toggle('active', target === activeId);
        });
      };
    }

    // Dynamic Navigation Routing
    function navigateTo(id, anchor) {
      if (id === 'dashboard') {
        window.location.hash = 'dashboard';
        return;
      }
      const hash = id + (anchor ? `:${anchor}` : '');
      window.location.hash = hash;
      sidebar.classList.remove('open');
    }

    // Helper to parse dynamic route parameters from hash (docId:anchor)
    function parseHash(hashStr) {
      const parts = hashStr.split(':');
      return {
        docId: parts[0] || '',
        anchor: parts[1] || ''
      };
    }

    // Full-text Local Search Engine (Vietnamese accent-insensitive)
    function executeSearch(query) {
      if (!query.trim()) {
        if (currentDocId === 'dashboard') {
          loadDashboardView();
        } else if (currentDocId) {
          loadDocument(currentDocId);
        }
        return;
      }

      documentContent.style.display = 'none';
      dashboardView.style.display = 'none';
      document.getElementById('toc-wrapper').style.display = 'none';
      searchResults.style.display = 'flex';
      
      breadcrumbs.innerHTML = `
        <span>Tìm kiếm</span>
        <span class="breadcrumb-sep">&gt;</span>
        <span style="color: var(--text-primary); font-weight: 500;">"${query}"</span>
      `;

      const normalizedQuery = removeDiacritics(query);
      const results = [];

      docs.forEach(doc => {
        const titleMatch = removeDiacritics(doc.title).includes(normalizedQuery);
        const contentNorm = removeDiacritics(doc.content);
        const queryIndex = contentNorm.indexOf(normalizedQuery);
        
        if (titleMatch || queryIndex !== -1) {
          let snippet = "";
          
          if (queryIndex !== -1) {
            const start = Math.max(0, queryIndex - 60);
            const end = Math.min(doc.content.length, queryIndex + normalizedQuery.length + 100);
            let rawSnippet = doc.content.substring(start, end);
            
            const searchPattern = new RegExp(`(${query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')})`, 'gi');
            snippet = rawSnippet.replace(searchPattern, '<span class="highlight">$1</span>');
            snippet = (start > 0 ? '...' : '') + snippet + (end < doc.content.length ? '...' : '');
          } else {
            snippet = doc.content.substring(0, 160) + '...';
          }

          results.push({
            id: doc.id,
            title: doc.title,
            path: doc.path,
            snippet: snippet
          });
        }
      });

      if (results.length === 0) {
        searchResultsList.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-secondary);">
          <span style="width: 48px; height: 48px; display: inline-block; margin-bottom: 12px; color: var(--text-secondary);">${SVGS.frown}</span>
          <p>Không tìm thấy kết quả nào phù hợp với từ khóa.</p>
        </div>`;
      } else {
        let listHtml = "";
        results.forEach(res => {
          listHtml += `
            <div class="search-result-item" onclick="navigateTo('${res.id}'); document.getElementById('search-input').value = '';">
              <div class="search-result-title">${res.title}</div>
              <div class="search-result-snippet">${res.snippet}</div>
              <div class="search-result-path">${res.path}</div>
            </div>
          `;
        });
        searchResultsList.innerHTML = listHtml;
      }
    }

    // Event Listeners
    searchInput.addEventListener('input', (e) => {
      executeSearch(e.target.value);
    });

    menuToggle.addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });

    // Close sidebar on mobile when clicking outside
    document.addEventListener('click', (e) => {
      if (window.innerWidth <= 768) {
        if (!sidebar.contains(e.target) && !menuToggle.contains(e.target) && sidebar.classList.contains('open')) {
          sidebar.classList.remove('open');
        }
      }
    });

    // Handle Hash Navigation (browser history)
    window.addEventListener('hashchange', () => {
      const hashStr = window.location.hash.substring(1);
      if (hashStr === 'dashboard' || !hashStr) {
        loadDashboardView();
      } else {
        const { docId, anchor } = parseHash(hashStr);
        if (docId) {
          loadDocument(docId, anchor);
        }
      }
    });

    // On Load Initial Setup
    window.addEventListener('DOMContentLoaded', () => {
      renderSidebar();
      
      const hashStr = window.location.hash.substring(1);
      if (hashStr && hashStr !== 'dashboard') {
        const { docId, anchor } = parseHash(hashStr);
        if (docId && docs.some(d => d.id === docId)) {
          loadDocument(docId, anchor);
          return;
        }
      }
      
      // Default load Cockpit Dashboard
      loadDashboardView();
    });

  </script>
</body>
</html>
