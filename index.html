    "content": "# Bản đồ Quy trình & Luồng Vận hành Agentic SDLC (Master Visual Map)\n\nTài liệu này tổng hợp và trực quan hóa toàn bộ vòng đời phát triển phần mềm bằng AI Agent (Agentic SDLC). Các sơ đồ dưới đây giúp bạn dễ dàng hình dung từ khâu thiết lập ý định, lập kế hoạch, viết code, kiểm thử, duyệt tích hợp (Merge Gate) cho đến giám sát vận hành 24/7 và cơ chế tự động học hỏi, cải tiến liên tục.\n\n---\n\n## 1. Bản đồ Toàn cảnh Quy trình Agentic SDLC (Master Landscape Map)\nSơ đồ dưới đây bao quát 8 pha trong vòng đời phát triển Agentic (ADLC), làm rõ mối quan hệ giữa **các hoạt động**, **các bên chịu trách nhiệm (Vai trò)**, **các Artifact sinh ra** và **cách con người kiểm soát (HITL)**.\n\n```mermaid\nflowchart TB\n    subgraph Phase1[\"Pha 1: Đặc tả ý định (Intent & Constraints)\"]\n        direction TB\n        P1_In[\"Yêu cầu nghiệp vụ (Business Requirement)\"] --> P1_Act[\"Đặc tả mục tiêu, tiêu chí hoàn thành (DoD), ràng buộc & ngân sách\"]\n        P1_Act --> P1_Art[\"Artifacts:<br/>- Feature Spec<br/>- UI/Component Contracts<br/>- Module Contracts\"]\n    end\n\n    subgraph Phase2[\"Pha 2: Lập kế hoạch (Planning & Phân rã)\"]\n        direction TB\n        P2_In[\"Artifacts của Pha 1\"] --> P2_Act[\"Phân tách nhiệm vụ thành các task nhỏ, lập sơ đồ sở hữu (Ownership Map) & xác định rủi ro\"]\n        P2_Act --> P2_Art[\"Artifacts:<br/>- Agent Task Brief<br/>- ADR (Architecture Decision Record)\"]\n    end\n\n    subgraph Phase3[\"Pha 3: Thực thi (Build / Action)\"]\n        direction TB\n        P3_In[\"Task Brief & Constraints\"] --> P3_Act[\"Thực thi code/thao tác trong nhánh cô lập (Isolated Worktree/Branch)\"]\n        P3_Act --> P3_Art[\"Artifacts:<br/>- Mã nguồn (Source Code)<br/>- Tests mới\"]\n    end\n\n    subgraph Phase4[\"Pha 4: Kiểm thử & Đánh giá (Validation & Evals)\"]\n        direction TB\n        P4_In[\"Source Code & Tests\"] --> P4_Act[\"Chạy CI tự động: Unit Evals, LLM-as-judge Regression, Visual Regression, Contract Tests\"]\n        P4_Act --> P4_Art[\"Artifacts:<br/>- Báo cáo kết quả Evals & Tests\"]\n    end\n\n    subgraph Phase5[\"Pha 5: Review & Duyệt (Human Checkpoint - HITL)\"]\n        direction TB\n        P5_In[\"Báo cáo Evals\"] --> P5_Act[\"Con người duyệt tại checkpoint đối với các hành động rủi ro trung bình/cao\"]\n        P5_Act --> P5_Art[\"Artifacts:<br/>- Merge Gate Report\"]\n    end\n\n    subgraph Phase6[\"Pha 6: Triển khai (Deploy / Ship)\"]\n        direction TB\n        P6_In[\"Merge Gate Approved\"] --> P6_Act[\"Tích hợp mã nguồn vào nhánh chính & deploy thông qua cổng chất lượng tự động\"]\n        P6_Act --> P6_Art[\"Artifacts:<br/>- Release Note<br/>- Production Deployment\"]\n    end\n\n    subgraph Phase7[\"Pha 7: Vận hành & Quan sát (Operate 24/7)\"]\n        direction TB\n        P7_In[\"Production Deployment\"] --> P7_Act[\"Vận hành 24/7, giám sát traces OpenTelemetry, metrics chi phí & độ tin cậy\"]\n        P7_Act --> P7_Art[\"Artifacts:<br/>- Telemetry Traces<br/>- Dashboards & Alerts\"]\n    end\n\n    subgraph Phase8[\"Pha 8: Học & Tự cải thiện (Learn & Self-Improvement)\"]\n        direction TB\n        P8_In[\"Telemetry Traces & Logs\"] --> P8_Act[\"Phân tích lỗi tự động, đề xuất nâng cấp Prompt/Skill, thử nghiệm sandbox\"]\n        P8_Act --> P8_Art[\"Artifacts:<br/>- Prompt/Skill cập nhật<br/>- Memory bổ sung\"]\n    end\n\n    %% Kết nối giữa các Pha\n    Phase1 --> Phase2\n    Phase2 --> Phase3\n    Phase3 --> Phase4\n    Phase4 --> Phase5\n    Phase5 -->|Duyệt| Phase6\n    Phase5 -->|Từ chối / Yêu cầu sửa| Phase2\n    Phase6 --> Phase7\n    Phase7 --> Phase8\n    Phase8 -.->|\"Cập nhật ý định/ràng buộc (Vòng lặp học hỏi)\"| Phase1\n    Phase7 -.->|\"Sự cố hoặc Drift\"| Phase4\n\n    %% Styling\n    classDef human fill:#d1e7dd,stroke:#0f5132,stroke-width:2px;\n    classDef agent fill:#cff4fc,stroke:#087990,stroke-width:2px;\n    classDef gate fill:#fff3cd,stroke:#664d03,stroke-width:2px;\n    classDef learn fill:#f8d7da,stroke:#842029,stroke-width:2px;\n\n    class Phase1,Phase5 human;\n    class Phase2,Phase3 agent;\n    class Phase4,Phase6 gate;\n    class Phase7,Phase8 learn;\n```\n\n---\n\n## 2. Sơ đồ Trình tự Phát triển Tính năng (Feature Development Sequence Diagram)\nSơ đồ trình tự thời gian thể hiện sự phối hợp chặt chẽ giữa các vai trò Con người, AI Supervisor, AI Coding Agents, hệ thống kiểm thử CI/CD và giám sát vận hành:\n\n```mermaid\nsequenceDiagram\n    autonumber\n    actor PO as Product Owner\n    actor Arch as Architect / Designer\n    actor Dev as Developer / Lead\n    participant Sup as Supervisor Agent\n    participant Agent as Coding Agent\n    participant CI as CI/CD & Evals\n    participant Obs as Observe System\n\n    Note over PO, Dev: Giai đoạn 1: Chuẩn bị & Đóng băng\n    PO->>Arch: Gửi Feature Spec & Nghiệp vụ\n    Arch->>Arch: Thiết lập Design Tokens & ADR\n    Arch->>Dev: Đóng băng kiến trúc (Architecture Freeze)\n    Dev->>Sup: Giao Task Brief, Contracts & Ràng buộc\n\n    Note over Sup, Agent: Giai đoạn 2: Lập kế hoạch & Thực thi\n    Sup->>Sup: Lập kế hoạch phân rã Task & Ownership Map\n    Sup->>Agent: Tạo isolated branch & Giao Task\n    loop Tự sửa lỗi (Self-Correction Loop)\n        Agent->>Agent: Viết code trong Sandbox\n        Agent->>Agent: Chạy test nội bộ & Tự sửa lỗi\n    end\n    Agent->>Sup: Hoàn thành nhiệm vụ & Đẩy mã nguồn\n\n    Note over Sup, CI: Giai đoạn 3: Kiểm định tự động & Duyệt\n    Sup->>CI: Kích hoạt Pipeline Evals\n    activate CI\n    CI->>CI: Chạy Unit Evals & Contract Tests\n    CI->>CI: Chạy Visual Regression & LLM-as-judge\n    CI-->>Sup: Báo cáo kết quả kiểm tra\n    deactivate CI\n    Sup->>Sup: Tạo Merge Gate Report\n    Sup->>Dev: Gửi PR & Merge Gate Report (HITL Checkpoint)\n    alt Đạt chất lượng & Duyệt\n        Dev->>CI: Xác nhận Merge PR & Deploy\n        CI->>Obs: Deploy lên Production thành công\n    else Thất bại hoặc Cần điều chỉnh\n        Dev->>Sup: Phản hồi lỗi & Từ chối merge\n        Sup->>Agent: Yêu cầu sửa đổi kèm feedback\n    end\n\n    Note over Obs, Dev: Giai đoạn 4: Vận hành & Giám sát 24/7\n    Obs->>Obs: Tracing OTel GenAI & Theo dõi chi phí\n    alt Sự cố / Runaway Loop / Trôi chất lượng (Drift)\n        Obs->>Obs: Kích hoạt Circuit Breaker / Fallback\n        Obs-->>Dev: Alert cảnh báo lỗi để con người xử lý (HITL)\n    end\n```\n\n---\n\n## 3. Sơ đồ Trạng thái Nhiệm vụ của Agent (Agent Task Lifecycle State Diagram)\nTheo dõi trạng thái của một nhiệm vụ dưới sự thực thi của AI Agent, bao gồm cả vòng lặp tự sửa lỗi (Self-Correction) và kiểm thử chất lượng:\n\n```mermaid\nstateDiagram-v2\n    [*] --> Created : Giao Task Brief\n    Created --> Planning : Xác thực ý định & ràng buộc\n    Planning --> InSandbox : Đã chốt kế hoạch thực thi\n\n    state InSandbox {\n        [*] --> Executing : Đọc/Viết file & Gọi Tool\n        Executing --> Compiling : Trình biên dịch/Linter\n        Compiling --> Executing : Có lỗi syntax (Tự sửa)\n        Compiling --> DoneCode : Compile thành công\n    }\n\n    InSandbox --> SelfTesting : Bắt đầu chạy test tự động\n    \n    state SelfTesting {\n        [*] --> RunningTests : Chạy bộ Test đơn vị\n        RunningTests --> FixingCode : Test thất bại\n        FixingCode --> RunningTests : Cập nhật code & chạy lại\n        RunningTests --> DoneTesting : 100% Test thành công\n    }\n\n    SelfTesting --> Evaluating : Chạy bộ Eval chất lượng nâng cao (Offline Evals)\n    \n    state Evaluating {\n        [*] --> UnitEvals : Chạy Unit Evals\n        UnitEvals --> LLM_Judge : Chạy LLM-as-judge\n        LLM_Judge --> ContractTests : Chạy Contract Tests\n        ContractTests --> PassedAll : Tất cả Evals đạt chỉ số baseline\n    }\n\n    Evaluating --> AwaitingReview : Đẩy PR & Gửi báo cáo Merge Gate\n    Evaluating --> Planning : Thất bại Evals (Thiếu ngữ cảnh/Chệch mục tiêu)\n    \n    AwaitingReview --> Approved : Con người chấp thuận (HITL)\n    AwaitingReview --> Planning : Con người từ chối (Góp ý/Thay đổi spec)\n    \n    Approved --> Merged : Thực hiện merge & đóng nhánh\n    Merged --> [*]\n```\n\n---\n\n## 4. Sơ đồ Kiến trúc Vận hành 24/7 & Xử lý lỗi (24/7 Operation & Error Recovery Architecture)\nMô tả cơ chế chạy liên tục của Agent trong môi trường Production cùng với các lớp phòng vệ (Guardrails) và khả năng tự đứng dậy (Error Recovery):\n\n```mermaid\nflowchart TB\n    %% Inputs and entry\n    Event[\"Sự kiện / API Request / Lịch biểu Cron\"] --> GuardIn[\"Lớp Guardrail đầu vào (Input Guardrails)<br/>- Lọc prompt injection<br/>- Kiểm tra policy quyền hạn<br/>- Phân loại ý đồ\"]\n\n    %% Core routing\n    GuardIn -->|Hợp lệ| AgentCore[\"Lõi Agent (Agent Core)<br/>- Lập kế hoạch (Reasoner)<br/>- Trí nhớ ngắn/dài hạn<br/>- Gọi Tools / APIs\"]\n    GuardIn -->|Vi phạm| Reject[\"Từ chối & Ghi log bảo mật\"]\n\n    %% Output verification\n    AgentCore --> GuardOut[\"Lớp Guardrail đầu ra (Output Guardrails)<br/>- Kiểm duyệt nội dung<br/>- Chặn hành động rủi ro cao<br/>- Lọc dữ liệu nhạy cảm (PII)\"]\n\n    %% Execution and results\n    GuardOut -->|Hợp lệ| Action[\"Hành động thực tế<br/>(Write database / Gọi API ngoài / Trả phản hồi)\"]\n    GuardOut -->|Vi phạm| SandboxFix[\"Chặn & Gửi lỗi ngược lại Agent để sửa đổi\"]\n\n    %% Observability Layer\n    AgentCore -. Trace dữ liệu .-> OTel[\"Tracing (OpenTelemetry GenAI)<br/>- Theo dõi chuỗi quyết định (Trace)<br/>- Ghi nhận Tool call & Token cost\"]\n    OTel --> EvalOnline[\"Online Evaluation<br/>- Lấy mẫu đánh giá thực tế (Sampling)\"]\n    EvalOnline --> Alerts[\"Hệ thống cảnh báo (Alerting)<br/>- Vòng lặp runaway loop?<br/>- Chi phí vượt hạn mức?<br/>- Lỗi hệ thống?\"]\n\n    %% Error Recovery loop\n    AgentCore -->|Gặp lỗi Tool/API/Logic| ErrRecover{\"Bộ Xử lý lỗi (Error Recovery)\"}\n    ErrRecover -->|Lỗi nhẹ / có thể tự sửa| Retry[\"Retry với Exponential Backoff & Fallback Tool\"]\n    Retry --> AgentCore\n    ErrRecover -->|Dependency hỏng liên tục| CircuitBreaker[\"Circuit Breaker<br/>- Tạm ngắt kết nối dịch vụ\"]\n    ErrRecover -->|Lỗi nặng / Runaway Loop| HITL[\"Escalate tới Con người (HITL)<br/>- Tạm dừng agent<br/>- Gửi thông báo khẩn cấp\"]\n\n    Alerts -->|Bất thường vượt ngưỡng| HITL\n\n    %% Styling\n    classDef core fill:#e3f2fd,stroke:#1565c0,stroke-width:2px;\n    classDef security fill:#ffebee,stroke:#c62828,stroke-width:2px;\n    classDef obs fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px;\n    classDef recovery fill:#fff3e0,stroke:#e65100,stroke-width:2px;\n\n    class AgentCore core;\n    class GuardIn,GuardOut,Reject security;\n    class OTel,EvalOnline,Alerts obs;\n    class ErrRecover,Retry,CircuitBreaker,HITL recovery;\n```\n\n---\n\n## 5. Sơ đồ Vòng lặp Tự cải thiện liên tục (Continuous Self-Improvement Loop)\nMô phỏng cách hệ thống tự học từ các dữ liệu vận hành thực tế mà vẫn đảm bảo tính an toàn cao (không gây lỗi regression):\n\n```mermaid\nflowchart LR\n    %% Main path\n    Prod[\"Vận hành thực tế (Production)\"] --> TraceLogs[\"Thu thập Traces & Logs (OTel)\"]\n    TraceLogs --> FailAnalysis[\"Phân tích lỗi tự động<br/>(Failure Analysis)\"]\n    FailAnalysis --> GenImprove[\"Đề xuất phương án cải tiến<br/>(Prompt / Skill / Memory / Tool mới)\"]\n    \n    %% Sandbox verification\n    GenImprove --> SandboxEval[\"Thử nghiệm trong Sandbox<br/>(Offline Eval Suite)\"]\n    SandboxEval --> RegressionCheck{\"Đạt chỉ số & không Regression?\"}\n    \n    %% Deployment Decisions\n    RegressionCheck -->|Không đạt| Discard[\"Hủy bỏ & phân tích lại lỗi\"]\n    RegressionCheck -->|Đạt| Canary[\"Triển khai dần (Canary / A-B Testing)\"]\n    \n    %% Return path\n    Canary --> CompareProd[\"So sánh hiệu năng thực tế\"]\n    CompareProd -->|Tốt hơn| MergeMain[\"Tích hợp chính thức vào Production\"]\n    CompareProd -->|Tệ hơn| Rollback[\"Rollback về phiên bản cũ\"]\n    \n    MergeMain --> Prod\n    Discard -.-> FailAnalysis\n    Rollback -.-> FailAnalysis\n\n    %% Styling\n    classDef sandbox fill:#fff3e0,stroke:#e65100,stroke-width:2px;\n    classDef decision fill:#f8d7da,stroke:#842029,stroke-width:2px;\n    classDef prod fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px;\n\n    class SandboxEval sandbox;\n    class RegressionCheck,CompareProd decision;\n    class Prod,Canary,MergeMain prod;\n```\n\n---\n\n## 6. Bản đồ Cổng Kiểm soát Chất lượng Doanh nghiệp (Enterprise Quality Control Gates Map)\nTrực quan hóa ma trận kiểm soát chất lượng (Quality Control Matrix), đảm bảo các đầu ra kỹ thuật luôn tuân thủ các chuẩn chung trước khi tích hợp vào nhánh chính:\n\n```mermaid\nflowchart TB\n    %% Pillars\n    subgraph UIUX[\"Cổng Chất lượng UI/UX\"]\n        direction TB\n        Tokens[\"Design Tokens (Nguồn sự thật)\"] --> TokenLint[\"Linter kiểm tra hard-code style\"]\n        TokenLint --> VisualReg[\"Chạy Visual Regression (So sánh Screenshot Diff)\"]\n        VisualReg --> A11y[\"Kiểm tra Responsive & Accessibility\"]\n        A11y --> DesignerReview[\"Designer Checkpoint (Con người duyệt)\"]\n    end\n\n    subgraph Arch[\"Cổng Chất lượng Kiến trúc\"]\n        direction TB\n        ADR[\"Duyệt ADR + Rollback Path\"] --> ArchTests[\"Architecture Tests (Dependency Rules)\"]\n        ArchTests --> SecScans[\"Quét bảo mật (Security Scans & Threat Mitigation)\"]\n        SecScans --> ArchitectReview[\"Architect + Security Lead Review (HITL)\"]\n    end\n\n    subgraph Domain[\"Cổng Chất lượng Module lớn\"]\n        direction TB\n        Contracts[\"Xác lập Interface Contract & Domain Map\"] --> ContractTests[\"Consumer-Driven Contract Tests\"]\n        ContractTests --> IntegTests[\"Integration Tests (Kiểm thử liên hợp)\"]\n        IntegTests --> E2E[\"E2E Nghiệp vụ (Kiểm thử luồng đầu-cuối)\"]\n        E2E --> DomainReview[\"Domain Owner Review & Approval\"]\n    end\n\n    subgraph MultiAgent[\"Cổng Kiểm soát Multi-Agent\"]\n        direction TB\n        TaskMap[\"Lập Task Ownership Map & Isolated Branches\"] --> BranchCI[\"CI chạy độc lập trên từng Branch\"]\n        BranchCI --> BudgetGuard[\"Budget/Loop Guards & Trace Tracking\"]\n        BudgetGuard --> SupervisorReview[\"Supervisor / Tech Lead Review\"]\n    end\n\n    %% Convergence\n    DesignerReview --> MergeGate{\"Hộp Tích hợp chính (Master Merge Gate)\"}\n    ArchitectReview --> MergeGate\n    DomainReview --> MergeGate\n    SupervisorReview --> MergeGate\n\n    MergeGate -->|Tất cả thông qua| Ship[\"Merge & Release Code\"]\n    MergeGate -->|Có cổng thất bại| Block[\"Từ chối & Yêu cầu sửa đổi\"]\n\n    %% Styling\n    classDef gate fill:#fff3cd,stroke:#664d03,stroke-width:2px;\n    classDef check fill:#d1e7dd,stroke:#0f5132,stroke-width:2px;\n    classDef final fill:#e8f5e9,stroke:#2e7d32,stroke-width:2px;\n\n    class UIUX,Arch,Domain,MultiAgent gate;\n    class DesignerReview,ArchitectReview,DomainReview,SupervisorReview check;\n    class MergeGate,Ship final;\n```\n\n---\n\n## 7. Quy trình Figma-to-Code & Vòng lặp Visual QA tự động\nTrực quan hóa luồng đồng bộ biến thiết kế (Figma variables) thành mã nguồn dưới sự giám sát nghiêm ngặt của Linter và bộ test so sánh Visual Regression:\n\n```mermaid\nflowchart TD\n    Fig[\"Figma Designs / Variables\"] -->|Export JSON| Tokens[\"Tokens.json (Color, Spacing, Typography)\"]\n    Fig -->|Export Layout| Layout[\"Layout Blueprint JSON\"]\n    Tokens & Layout -->|Đầu vào nghiêm ngặt| Agent[\"Coding Agent Sandbox\"]\n    Agent -->|Tạo mã nguồn| Linter{\"Tailwind/CSS Linter Check\"}\n    Linter -->|Fail: Có Class tự chế / Hardcoded color| LintErr[\"Báo lỗi linter & Trích xuất dòng code\"]\n    LintErr -->|Feedback| Agent\n    Linter -->|Pass: Chỉ dùng classes token| Render[\"Playwright Headless Browser Render\"]\n    Render -->|Chụp Screenshot| RealImg[\"Giao diện thực (Actual Screen)\"]\n    Fig -->|Figma API Export Screenshot| DesignImg[\"Bản thiết kế mẫu (Baseline Screen)\"]\n    RealImg & DesignImg -->|Pixel Match Compare| DiffCheck{\"So sánh Visual Diff > 0.5%?\"}\n    DiffCheck -->|Có lệch| DiffImg[\"Tạo Ảnh Diff Tô Đỏ Lỗi + Sai Spacing CSS\"]\n    DiffImg -->|Feedback trực quan| Agent\n    DiffCheck -->|Không lệch| SignOff{\"Designer Portal Review (HITL)\"}\n    SignOff -->|Từ chối| SignReject[\"Ghi log feedback hình ảnh & comment\"]\n    SignReject -->|Feedback| Agent\n    SignOff -->|Duyệt| MergePR[\"Master Merge PR & Deploy\"]\n```\n\n---\n\n## 8. Kiến trúc Điều phối Multi-Agent song song hướng Domain (DDMA)\nMô hình chạy song song các Agent lập trình mà vẫn bảo vệ tính toàn vẹn của logic, ranh giới domain và tự động giải quyết các xung đột tích hợp:\n\n```mermaid\nflowchart TB\n    Supervisor[\"Supervisor Agent\"] -->|Phân rã Specs & ADR| OwnershipMap[\"Task Ownership Map\"]\n    \n    subgraph Isolation[\"Không gian cách ly (Workspace Isolation)\"]\n        WorktreeA[\"Git Branch & Worktree A<br/>(Chỉ được phép sửa /src/modules/billing/)\"]\n        WorktreeB[\"Git Branch & Worktree B<br/>(Chỉ được phép sửa /src/modules/customer/)\"]\n    end\n    \n    OwnershipMap -->|Gán & khóa thư mục sửa đổi| WorktreeA\n    OwnershipMap -->|Gán & khóa thư mục sửa đổi| WorktreeB\n    \n    SchemaLock[(\"Database Schema Locked<br/>(Không được sửa schema DB)\")] -.-> Isolation\n    \n    subgraph Registry[\"Shared Contract Registry\"]\n        APISpec[\"API Specs (OpenAPI/GraphQL)\"]\n        EventSpec[\"Event Schemas (Avro)\"]\n    end\n    \n    WorktreeA & WorktreeB <-->|Tuân thủ contract| Registry\n    \n    WorktreeA -->|Đẩy code| CI_GateA[\"Branch CI A (Pact Contract Tests & Unit tests)\"]\n    WorktreeB -->|Đẩy code| CI_GateB[\"Branch CI B (Pact Contract Tests & Unit tests)\"]\n    \n    CI_GateA & CI_GateB --> MasterGate{\"Master CI & Integration Gate\"}\n    \n    MasterGate -->|Xung đột contract / API fail| DebateRoom[\"Agentic Debate Room (Supervisor-moderated)\"]\n    DebateRoom -->|Vòng 1: Đề xuất & Chia sẻ context| DebateRoom\n    DebateRoom -->|Vòng 2: Căn chỉnh tự động specs| DebateRoom\n    DebateRoom -->|Vòng 3: Cập nhật code tương thích| DebateRoom\n    \n    DebateRoom -->|Giải quyết xong & tests pass| MasterGate\n    DebateRoom -->|Thất bại sau 3 vòng| TechLead[\"Technical Lead HITL Checkpoint\"]\n    \n    MasterGate -->|Pass all E2E & Contract tests| MasterMerge[\"Master Merge & Release\"]\n```\n```\n\n---\n\n> **Nguyên tắc cốt lõi của bản đồ:**\n> 1. **Con người nắm giữ ý định & cấu trúc:** Con người chịu trách nhiệm duyệt Spec, Kiến trúc (ADR), chuẩn giao diện (UI system) và hợp đồng module (Contracts).\n> 2. **AI Agent thực thi trong ràng buộc:** Agent tự hoạt động, viết code, sửa lỗi và thực hiện quy trình tự động trong phạm vi các hộp chất lượng và sandbox được thiết lập sẵn.\n> 3. **Vòng lặp đóng khép kín:** Mọi hành vi sai lệch trong vận hành (drift) hoặc sự cố sản phẩm đều là đầu vào để cải tiến hệ thống eval và huấn luyện/cải tiến kỹ năng của Agent một cách tự động.\n"

    "content": "# Bản đồ Hệ thống Tài liệu & Cấu trúc Dự án (Agentic SDLC Documentation Map)\n\nChào mừng bạn đến với **Bản đồ Hệ thống Tài liệu và Cấu trúc Dự án** của hệ điều hành Agentic SDLC (Agentic SDLC Operating System). Tài liệu này được tạo ra để giúp bạn có một cái nhìn toàn cảnh, rõ ràng và mạch lạc nhất về toàn bộ cấu trúc thư mục, các file tài liệu hướng dẫn (playbooks), các checklists kiểm soát chất lượng, và các biểu mẫu (templates) vận hành thực tế trong dự án này.\n\n---\n\n## 1. Sơ đồ Quan hệ Hệ thống Tài liệu\n\nSơ đồ dưới đây trực quan hóa cách các tài liệu, mẫu biểu và checklists kết nối với nhau, từ tổng quan nền tảng đến thực thi chi tiết:\n\n```mermaid\nflowchart TD\n    %% Core Guides\n    subgraph Core[\"Tài liệu Nền tảng (Core Guides)\"]\n        README[\"README.md<br/>(Giới thiệu chung & Hướng dẫn sử dụng)\"]\n        DeepDive[\"Agentic_SDLC_Deep_Dive.md<br/>(Hiểu sâu bản chất, kiến trúc & 4 trụ cột)\"]\n        MasterMap[\"Agentic_SDLC_Master_Map.md<br/>(Bản đồ quy trình & 8 sơ đồ Mermaid chi tiết)\"]\n        DocMap[\"DOCUMENTATION_MAP.md<br/>(Bản đồ tài liệu & Cấu trúc dự án - File này)\"]\n    end\n\n    %% Chapters\n    subgraph Chapters[\"Cẩm nang chi tiết (Detailed Playbooks)\"]\n        C00[\"00-overview.md<br/>(Tổng quan & Luồng áp dụng)\"]\n        C01[\"01-lifecycle.md<br/>(Vòng đời ADLC)\"]\n        C02[\"02-playbook.md<br/>(Enterprise Playbook)\"]\n        C03[\"03-qc-matrix.md<br/>(Quality Matrix)\"]\n        C04[\"04-ui-ux.md<br/>(UI/UX Control)\"]\n        C05[\"05-architecture.md<br/>(Arch Governance)\"]\n        C06[\"06-modules.md<br/>(Large Modules)\"]\n        C07[\"07-multi-agent.md<br/>(Multi-Agent Orchestration)\"]\n        C08[\"08-observability.md<br/>(OTel & Evals)\"]\n        C09[\"09-roadmap.md<br/>(Adoption Roadmap)\"]\n    end\n\n    %% Templates & Checklists\n    subgraph Checklists[\"Checklists kiểm tra (Quality Checklists)\"]\n        checklists/ui-ux.md\n        checklists/architecture.md\n        checklists/module-large-system.md\n        checklists/multi-agent.md\n        checklists/observability.md\n        checklists/release-readiness.md\n    end\n\n    subgraph Templates[\"Biểu mẫu vận hành (Operational Templates)\"]\n        T_specs[\"templates/specs/<br/>(DoD, Feature Spec, PRD)\"]\n        T_arch[\"templates/architecture/<br/>(ADR, Reviews, Freeze, Threat)\"]\n        T_ui[\"templates/ui-ux/<br/>(Component, Design System Contracts)\"]\n        T_modules[\"templates/modules/<br/>(Contracts, Boundaries, E2E)\"]\n        T_agents[\"templates/agents/<br/>(Task Briefs, AGENTS.md, Merge Gate)\"]\n        T_quality[\"templates/quality/<br/>(Evals, Release Gates, QC Matrix)\"]\n    end\n\n    %% Examples\n    subgraph Examples[\"Ví dụ thực tế (Practical Examples)\"]\n        sample-AGENTS.md\n        examples/sample-enterprise-feature/\n    end\n\n    %% Connections\n    README --> DocMap\n    DocMap --> MasterMap\n    MasterMap --> Chapters\n    Chapters --> Checklists\n    Chapters --> Templates\n    Templates --> Examples\n    Checklists --> Examples\n```\n\n---\n\n## 2. Cấu trúc Thư mục Toàn diện (Directory Tree Layout)\n\nDưới đây là sơ đồ cây thư mục chi tiết của dự án, mô tả vai trò của từng file để bạn dễ dàng tra cứu:\n\n```text\n📂 Agentic SDLC (Root Directory)\n├── 📄 README.md                        <- Hướng dẫn nhanh sử dụng repo, giới thiệu các playbook & template\n├── 📄 Agentic_SDLC_Deep_Dive.md        <- Tài liệu nền tảng đi sâu vào 4 trụ cột, lý thuyết & chi tiết kỹ thuật\n├── 📄 Agentic_SDLC_Master_Map.md       <- Master Visual Map chứa 8 sơ đồ Mermaid chi tiết toàn bộ quy trình\n├── 📄 DOCUMENTATION_MAP.md             <- Bản đồ hệ thống tài liệu và cấu trúc dự án (Tài liệu này)\n├── 📄 generate_portal.py               <- Script Python tự động biên dịch toàn bộ Markdown thành Portal HTML\n├── 📄 index.html                       <- Portal HTML Apple-style, hỗ trợ tìm kiếm và đọc tài liệu tập trung\n│\n├── 📂 docs                             <- Thư mục chứa các cẩm nang (Playbooks) vận hành chi tiết\n│   ├── 📄 00-overview.md               <- Giới thiệu tổng quan hệ điều hành và luồng áp dụng chuẩn\n│   ├── 📄 01-agentic-sdlc-lifecycle.md  <- Chi tiết 8 pha của Vòng đời Phát triển Agentic (ADLC)\n│   ├── 📄 02-enterprise-delivery-playbook.md <- Nguyên tắc điều hành, phân vai Human-Agent và phân loại rủi ro\n│   ├── 📄 03-quality-control-matrix.md <- Ma trận kiểm soát chất lượng (QC Matrix): Nguồn sự thật & Guardrails\n│   ├── 📄 04-ui-ux-control-system.md   <- Quy trình đồng bộ Figma-to-Code & QA hình ảnh tự động\n│   ├── 📄 05-architecture-governance.md <- Cơ chế Architecture Freeze & Review đa vai trước khi Agent code\n│   ├── 📄 06-large-module-delivery.md  <- Hợp đồng Module (Module Contracts) và thiết lập AGENTS.md phân tầng\n│   ├── 📄 07-multi-agent-orchestration.md <- Kỹ thuật điều phối multi-agent song song hướng Domain (DDMA)\n│   ├── 📄 08-observability-evals-governance.md <- Tracing OpenTelemetry, Evals và an toàn theo OWASP Agentic\n│   └── 📄 09-adoption-roadmap.md       <- Lộ trình 5 bước áp dụng và thang đo mức độ trưởng thành (Maturity)\n│\n├── 📂 checklists                       <- Thư mục chứa các checklist kiểm duyệt chất lượng độc lập\n│   ├── 📄 ui-ux.md                     <- Checklist kiểm tra giao diện, responsive, a11y và visual regression\n│   ├── 📄 architecture.md              <- Checklist chốt kiến trúc trước build và duyệt bảo mật/threat model\n│   ├── 📄 module-large-system.md       <- Checklist chia tách domain boundary và xác nhận interface contracts\n│   ├── 📄 multi-agent.md               <- Checklist điều phối nhánh, budget guard và tích hợp multi-agent\n│   ├── 📄 observability.md             <- Checklist cài đặt tracing OTel, online/offline evals và lập cảnh báo\n│   └── 📄 release-readiness.md         <- Checklist cổng chất lượng cuối cùng trước khi deploy sản phẩm\n│\n├── 📂 templates                        <- Thư mục chứa các biểu mẫu (templates) để áp dụng vào dự án\n│   ├── 📂 specs                        <- Templates đặc tả ý đồ nghiệp vụ ban đầu\n│   │   ├── 📄 product-requirement.md   <- Yêu cầu sản phẩm (PRD) cho con người viết\n│   │   ├── 📄 feature-spec.md          <- Đặc tả tính năng máy đọc được để cấp cho Agent\n│   │   └── 📄 definition-of-done.md    <- Tiêu chí hoàn thành (DoD) rõ ràng cho từng task\n│   │\n│   ├── 📂 architecture                 <- Templates phục vụ việc khóa kiến trúc nền tảng\n│   │   ├── 📄 adr.md                   <- Bản ghi Quyết định Kiến trúc (Architecture Decision Record)\n│   │   ├── 📄 threat-model.md          <- Phân tích rủi ro bảo mật & biện pháp giảm thiểu cho Agent\n│   │   ├── 📄 architecture-review.md   <- Biên bản đánh giá kiến trúc đa vai (Architect, Security, v.v.)\n│   │   └── 📄 architecture-freeze-checklist.md <- Checklist khóa kiến trúc trước khi giao việc cho Agent\n│   │\n│   ├── 📂 ui-ux                        <- Templates kiểm soát tính đồng nhất về mặt thị giác\n│   │   ├── 📄 design-system-contract.md <- Hợp đồng design tokens & component library được phép dùng\n│   │   ├── 📄 component-contract.md    <- Hợp đồng giao tiếp kỹ thuật của component UI cụ thể\n│   │   ├── 📄 ui-review-checklist.md   <- Checklist cho Designer duyệt thủ công trên cổng HITL\n│   │   └── 📄 visual-regression-checklist.md <- Tiêu chuẩn chạy Visual QA & so sánh Screenshot Diff tự động\n│   │\n│   ├── 📂 modules                      <- Templates phân rã nghiệp vụ hệ thống lớn\n│   │   ├── 📄 domain-boundary.md       <- Định nghĩa ranh giới và trách nhiệm của Domain Bounded Context\n│   │   ├── 📄 module-contract.md       <- Hợp đồng interface, data ownership và mô hình lỗi của module\n│   │   ├── 📄 data-ownership.md        <- Bản đồ phân định quyền đọc/ghi dữ liệu của các module\n│   │   └── 📄 e2e-business-flow.md     <- Đặc tả luồng nghiệp vụ liên hợp đầu-cuối xuyên module\n│   │\n│   ├── 📂 agents                       <- Templates thiết lập môi trường & điều phối Agent\n│   │   ├── 📄 root-AGENTS.md           <- File hướng dẫn & quy chuẩn code toàn cục đặt tại thư mục root\n│   │   ├── 📄 module-AGENTS.md         <- File hướng dẫn & ngữ cảnh nghiệp vụ cục bộ tại từng module\n│   │   ├── 📄 agent-task-brief.md      <- Phiếu giao việc (Task Brief) kèm ràng buộc chi tiết cho một Agent\n│   │   ├── 📄 multi-agent-ownership-map.md <- Sơ đồ phân chia nhánh và thư mục được phép sửa của từng Agent\n│   │   └── 📄 merge-gate-report.md     <- Báo cáo kết quả Evals & chất lượng trước khi merge PR (HITL checkpoint)\n│   │\n│   └── 📂 quality                      <- Templates đánh giá chất lượng và kiểm soát rủi ro vận hành\n│       ├── 📄 quality-control-matrix.md <- Ma trận kết nối rủi ro thực tế với guardrail tự động & checkpoint\n│       ├── 📄 eval-plan.md             <- Kế hoạch đánh giá 3 lớp (Unit Evals, LLM-as-judge, Production Sampling)\n│       ├── 📄 release-gate.md          <- Tiêu chí chốt chất lượng tự động chặn release khi regression\n│       └── 📄 production-readiness-checklist.md <- Checklist cổng chất lượng cuối cùng trước khi đưa lên chạy 24/7\n│\n└── 📂 examples                         <- Thư mục chứa các ví dụ thực tế hoàn chỉnh\n    ├── 📄 sample-AGENTS.md             <- Ví dụ cụ thể về nội dung file chỉ dẫn Agent trong dự án thật\n    └── 📂 sample-enterprise-feature   <- Ví dụ một tính năng doanh nghiệp đi từ đặc tả đến merge gate\n        ├── 📄 feature-spec.md          <- Feature Spec thực tế mẫu\n        ├── 📄 adr.md                   <- ADR thực tế mẫu khóa thiết kế lưu trữ\n        ├── 📄 ui-component-contract.md <- Hợp đồng component thực tế mẫu cho màn hình thanh toán\n        ├── 📄 module-contract.md       <- Hợp đồng interface thực tế mẫu giữa Billing & Customer modules\n        ├── 📄 agent-task-brief.md      <- Task Brief thực tế mẫu giao cho Code Agent thực hiện\n        └── 📄 merge-gate-report.md     <- Merge Gate Report thực tế mẫu gửi cho Tech Lead duyệt tích hợp\n```\n\n---\n\n## 3. Mapping Tài liệu theo 8 Pha của Vòng đời Agentic SDLC\n\nHệ điều hành Agentic SDLC được vận hành dựa trên 8 pha khép kín. Bảng dưới đây ánh xạ chính xác mỗi pha với các Playbooks hướng dẫn, Checklists kiểm duyệt, Biểu mẫu áp dụng và Ví dụ thực tế:\n\n| Pha vận hành | 📖 Playbooks (docs/) | 📋 Checklists | 📝 Templates | 🛠️ Ví dụ thực tế (examples/) |\n|---|---|---|---|---|\n| **Pha 1: Đặc tả ý định** *(Intent & DoD)* | [01-Lifecycle](file:///Users/tuananh/Library/Mobile%20Documents/com~apple~CloudDocs/CODEX/Agentic%20SDLC/docs/01-agentic-sdlc-lifecycle.md)<br/>[04-UI/UX Control](file:///Users/tuananh/Library/Mobile%20Documents/com~apple~CloudDocs/CODEX/Agentic%20SDLC/docs/04-ui-ux-control-system.md) | [ui-ux.md](file:///Users/tuananh/Library/Mobile%20Documents/com~apple~CloudDocs/CODEX/Agentic%20SDLC/checklists/ui-ux.md) | `specs/product-requirement.md`<br/>`specs/feature-spec.md`<br/>`specs/definition-of-done.md`<br/>`ui-ux/design-system-contract.md`<br/>`ui-ux/component-contract.md` | `sample-enterprise-feature/feature-spec.md`<br/>`sample-enterprise-feature/ui-component-contract.md` |\n| **Pha 2: Lập kế hoạch & Phân rã** *(Planning)* | [05-Architecture](file:///Users/tuananh/Library/Mobile%20Documents/com~apple~CloudDocs/CODEX/Agentic%20SDLC/docs/05-architecture-governance.md)<br/>[06-Large Modules](file:///Users/tuananh/Library/Mobile%20Documents/com~apple~CloudDocs/CODEX/Agentic%20SDLC/docs/06-large-module-delivery.md)<br/>[07-Multi-Agent](file:///Users/tuananh/Library/Mobile%20Documents/com~apple~CloudDocs/CODEX/Agentic%20SDLC/docs/07-multi-agent-orchestration.md) | [architecture.md](file:///Users/tuananh/Library/Mobile%20Documents/com~apple~CloudDocs/CODEX/Agentic%20SDLC/checklists/architecture.md)<br/>[module-large-system.md](file:///Users/tuananh/Library/Mobile%20Documents/com~apple~CloudDocs/CODEX/Agentic%20SDLC/checklists/module-large-system.md)<br/>[multi-agent.md](file:///Users/tuananh/Library/Mobile%20Documents/com~apple~CloudDocs/CODEX/Agentic%20SDLC/checklists/multi-agent.md) | `architecture/adr.md`<br/>`architecture/threat-model.md`<br/>`architecture/a .md`<br/>`ui-ux/ui-review-checklist.md` | `sample-enterprise-feature/merge-gate-report.md` |\n| **Pha 6: Triển khai** *(Deploy / Ship)* | [02-Enterprise Playbook](file:///Users/tuananh/Library/Mobile%20Documents/com~apple~CloudDocs/CODEX/Agentic%20SDLC/docs/02-enterprise-delivery-playbook.md) | [release-readiness.md](file:///Users/tuananh/Library/Mobile%20Documents/com~apple~CloudDocs/CODEX/Agentic%20SDLC/checklists/release-readiness.md) | `quality/release-gate.md`<br/>`quality/production-readiness-checklist.md` | *Được kích hoạt sau khi Merge Gate được phê duyệt* |\n| **Pha 7: Vận hành & Giám sát** *(Operate)* | [08-Observability](file:///Users/tuananh/Library/Mobile%20Documents/com~apple~CloudDocs/CODEX/Agentic%20SDLC/docs/08-observability-evals-governance.md) | [observability.md](file:///Users/tuananh/Library/Mobile%20Documents/com~apple~CloudDocs/CODEX/Agentic%20SDLC/checklists/observability.md) | `quality/eval-plan.md` | *Giám sát trace & chi phí tự động trên production* |\n| **Pha 8: Học & Tự cải thiện** *(Learn)* | [09-Roadmap](file:///Users/tuananh/Library/Mobile%20Documents/com~apple~CloudDocs/CODEX/Agentic%20SDLC/docs/09-adoption-roadmap.md) | *Vòng lặp tự động hóa khép kín* | *Cải tiến Prompt/Skill & Cập nhật Memory trong Sandbox* | *Phát hiện lỗi thực tế -> Trở thành test case offline* |\n\n---\n\n## 4. Ma trận Lựa chọn Tài liệu Theo Nhu cầu Sử dụng\n\nKhi gặp một vấn đề hoặc nhu cầu thực tế trong dự án, bạn nên sử dụng tài liệu nào? Hãy tham khảo bảng hướng dẫn nhanh dưới đây:\n\n| Bạn cần giải quyết vấn đề gì? | 📖 Playbook nên đọc | 📋 Checklist nên dùng | 📝 Template nên copy |\n|---|---|---|---|\n| **Bắt đầu một tính năng mới** cần làm rõ phạm vi nghiệp vụ và ràng buộc kỹ thuật. | [01-Lifecycle](file:///Users/tuananh/Library/Mobile%20Documents/com~apple~CloudDocs/CODEX/Agentic%20SDLC/docs/01-agentic-sdlc-lifecycle.md) | - | `specs/feature-spec.md`<br/>`specs/definition-of-done.md` |\n| **Chốt thiết kế kiến trúc** khó đảo ngược, lựa chọn cơ sở dữ liệu,     "path": "README.md",
    "content": "# Agentic SDLC Operating System\n\nRepo này biến `Agentic_SDLC_Deep_Dive.md` thành bộ tài liệu và mẫu triển khai Agentic SDLC cho phần mềm lớn, nhiều nghiệp vụ, có UI/UX phức tạp và nhiều AI agent cùng tham gia.\n\nNguyên lý điều hành:\n\n> Human owns intent, architecture, design standard, contracts; agents own execution inside constraints.\n\n## Dùng repo này như thế nào\n\n1. Xem [Bản đồ Hệ thống Tài liệu](DOCUMENTATION_MAP.md) để hiểu rõ cấu trúc thư mục, mối quan hệ giữa các playbooks, checklists và templates.\n2. Xem [Bản đồ Quy trình trực quan](Agentic_SDLC_Master_Map.md) để có cái nhìn toàn cảnh bằng sơ đồ luồng.\n3. Đọc [overview](docs/00-overview.md) để hiểu cấu trúc bộ tài liệu.\n4. Chọn playbook theo vấn đề cần giải quyết:\n   - [Agentic SDLC lifecycle](docs/01-agentic-sdlc-lifecycle.md)\n   - [Enterprise delivery playbook](docs/02-enterprise-delivery-playbook.md)\n   - [Quality control matrix](docs/03-quality-control-matrix.md)\n   - [UI/UX control system](docs/04-ui-ux-control-system.md)\n   - [Architecture governance](docs/05-architecture-governance.md)\n   - [Large module delivery](docs/06-large-module-delivery.md)\n   - [Multi-agent orchestration](docs/07-multi-agent-orchestration.md)\n   - [Observability, evals, governance](docs/08-observability-evals-governance.md)\n   - [Adoption roadmap](docs/09-adoption-roadmap.md)\n5. Copy template phù hợp từ `templates/` vào repo sản phẩm thật.\n6. Dùng checklist trong `checklists/` trước khi merge hoặc release.\n7. Xem ví dụ hoàn chỉnh trong `examples/sample-enterprise-feature/`.\n\n## Artifact chính\n\n- [DOCUMENTATION_MAP.md](DOCUMENTATION_MAP.md): Bản đồ hệ thống tài liệu và cấu trúc dự án (danh mục chi tiết, sơ đồ quan hệ tài liệu và bảng ánh xạ theo 8 pha ADLC).\n- [Agentic_SDLC_Master_Map.md](Agentic_SDLC_Master_Map.md): Bản đồ quy trình trực quan hóa bằng 8 sơ đồ Mermaid chi tiết.\n- [Agentic_SDLC_Deep_Dive.md](Agentic_SDLC_Deep_Dive.md): tài liệu nền tảng và giải thích sâu.\n- `docs/`:     "title": "Overview",
    "path": "docs/00-overview.md",
    "content": "# Overview\n\nBộ repo này là một \"operating system\" cho Agentic SDLC: không chỉ nói về AI agent, mà cung cấp tài liệu, template và checklist để điều hành AI agent trong dự án phần mềm thật.\n\n> [!TIP]\n> Bạn có thể bắt đầu bằng việc xem [Bản đồ Hệ thống Tài liệu](../DOCUMENTATION_MAP.md) để hiểu rõ cấu trúc thư mục, hoặc xem bản đồ trực quan toàn cảnh với các sơ đồ Mermaid chi tiết tại [Bản đồ Quy trình trực quan (Master Visual Map)](../Agentic_SDLC_Master_Map.md) trước khi đi sâu vào từng tài liệu cụ thể dưới đây.\n\n## Mục tiêu\n\n- Giữ UI/UX đồng nhất bằng design system, component contract và visual regression.\n- Khóa kiến trúc bằng spec, ADR, architecture review và freeze checklist trước khi agent build.\n- Chia module lớn theo domain boundary và interface contract để không mất logic nghiệp vụ.\n- Chạy multi-agent song song bằng supervisor, isolated worktree, ownership map và merge gate.\n- Đưa observability, eval, governance và HITL vào quy trình giao hàng.\n\n## Luồng áp dụng chuẩn\n\n```mermaid\nflowchart LR\n    R[Requirement] --> S[Feature spec]\n    S --> A[Architecture + ADR]\n    A --> C[Contracts<br/>UI, module, data]\n    C --> T[Agent task brief]\n    T --> I[Agent implementation]\n    I --> G[Quality gates]\n    G --> M[Merge / release]\n    M --> O[Observe + learn]\n```\n\n## Vai trò\n\n| Vai trò | Sở hữu |\n|---|---|\n| Product owner | Intent, business outcome, acceptance criteria |\n| Architect | Architecture, ADR, module boundary, rollback path |\n| Designer lead | Design system, UX rule, component approval |\n| Domain owner | Business rules, workflow, data meaning |\n| Agent supervisor | Task split, agent scope, merge coordination |\n| AI agent | Implementation inside approved constraints |\n\n## Nguồn tham chiếu\n\nXem chi tiết danh mục tài liệu tại [Bản đồ Hệ thống Tài liệu](../DOCUMENTATION_MAP.md). Đọc `Agentic_SDLC_Deep_Dive.md` khi cần hiểu sâu nền tảng lý thuyết, rủi ro, reasoning và bối cảnh. Dùng thư mục `docs/`, `templates/`, `checklists/` khi triển khai thực tế.\n\n"

    "id": "docs-01-agentic-sdlc-lifecycle",
    "category": "Detailed Chapters",

    "title": "Agentic SDLC Lifecycle",
    "path": "docs/01-agentic-sdlc-lifecycle.md",
    "content": "# Agentic SDLC Lifecycle\n\nAgentic SDLC là vòng đời phát triển trong đó AI agent tham gia xuyên suốt từ đặc tả, lập kế hoạch, thực thi, kiểm thử, review, deploy đến vận hành.\n\n> [!TIP]\n> Bạn có thể xem bản đồ trực quan đầy đủ của vòng đời này (gồm Sơ đồ Master, Sơ đồ Trình tự tương tác và Sơ đồ Trạng thái nhiệm vụ của Agent) tại [Bản đồ Quy trình trực quan (Master Visual Map)](../Agentic_SDLC_Master_Map.md).\n\n## Vòng đời chuẩn\n\n```mermaid\nflowchart LR\n    I[Intent + constraints] --> P[Planning]\n    P --> B[Build / action]\n    B --> V[Validation + eval]\n    V --> H[Human checkpoint]\n    H --> D[Deploy / ship]\n    D --> O[Operate 24/7]\n    O --> L[Learn + improve]\n    L --> I\n```\n\n## Cổng kiểm soát\n\n- Intent phải có success criteria, out-of-scope, risk level và budget.\n- Planning phải tạo task nhỏ, dependency, test expectation và owner.\n- Build chỉ được chạy trong constraint đã duyệt.\n- Validation gồm test tất định, eval chất lượng, security và regression.\n- Human checkpoint áp dụng cho quyết định khó đảo hoặc tác động cao.\n- Operate cần trace, metrics, alert, sampling và failure analysis.\n\n## Artifact cần có\n\n- Feature spec.\n- Definition of Done.\n- ADR nếu có quyết định kiến trúc.\n- UI/component contract nếu có UI.\n- Module contract nếu chạm biên module.\n- Agent task brief nếu giao cho AI agent.\n- Merge gate report trước khi merge.\n\n"
  },

    "id": "docs-02-enterprise-delivery-playbook",
    "category": "Detailed Chapters",

    "title": "Enterprise Delivery Playbook",
    "path": "docs/02-enterprise-delivery-playbook.md",
    "content": "# Enterprise Delivery Playbook\n\nPlaybook này áp dụng khi dự án có phần mềm lớn, nhiều nghiệp vụ, nhiều nhóm hoặc nhiều agent cùng tham gia.\n\n> [!TIP]\n> Để trực quan hóa các cổng chất lượng và sơ đồ giao hàng doanh nghiệp, xem [Bản đồ Cổng Kiểm soát Chất lượng Doanh nghiệp (Sơ đồ 6)](../Agentic_SDLC_Master_Map.md#6-bản-đồ-cổng-kiểm-soát-chất-lượng-doanh-nghiệp-enterprise-quality-control-gates-map) và [Sơ đồ Trình tự Phát triển Tính năng (Sơ đồ 2)](../Agentic_SDLC_Master_Map.md#2-sơ-đồ-trình-tự-phát-triển-tính-năng-feature-development-sequence-diagram).\n\n## Nguyên tắc vận hành\n\n> Human owns intent, architecture, design standard, contracts; agents own execution inside constraints.\n\nAgent không tự quyết:\n\n- kiến trúc nền tảng;\n- chuẩn UI/UX mới;\n- ranh giới module;\n- schema/event contract;\n- quyền truy cập production;\n- merge khi gate chưa đạt.\n\n## Quy trình delivery\n\n1. Product owner viết feature spec và acceptance criteria.\n2. Architect duyệt kiến trúc, ADR và rollback path.\n3. Designer/domain owner duyệt UI contract hoặc module contract.\n4. Supervisor chia task, ownership map và phạm vi cho từng agent.\n5. Agent implement trong branch/worktree riêng.\n6. CI/manual gate kiểm test, eval, contract, UI screenshot và security.\n7. Human reviewer duyệt merge gate report.\n8. Production trace được lấy mẫu để bổ sung regression/eval.\n\n## Cách chia mức rủi ro\n\n| Mức | Ví dụ | Gate |\n|---|---|---|\n| Thấp | copy text, test nhỏ, refactor local | Agent tự làm + CI |\n| Trung bình | UI thay đổi, API nhỏ, module nội bộ | Reviewer + checklist |\n| Cao | kiến trúc, schema, permission, data migration | ADR + architecture freeze + human approval |\n| Không hoàn tác | xóa dữ liệu, gửi tiền, thay production policy | Human approval bắt buộc trước hành động |\n\n"
  },

    "title": "Quality Control Matrix",
    "path": "docs/03-quality-control-matrix.md",
    "content": "# Quality Control Matrix\n\nMỗi rủi ro lớn phải có nguồn sự thật, guardrail tự động, checkpoint con người và tiêu chí pass/fail.\n\n> [!TIP]\n> Bản đồ trực quan của các cổng chất lượng được mô tả chi tiết tại [Bản đồ Cổng Kiểm soát Chất lượng Doanh nghiệp (Sơ đồ 6)](../Agentic_SDLC_Master_Map.md#6-bản-đồ-cổng-kiểm-soát-chất-lượng-doanh-nghiệp-enterprise-quality-control-gates-map).\n\n| Khu vực | Nguồn sự thật | Guardrail tự động | Checkpoint | Pass/fail |\n|---|---|---|---|---|\n| UI/UX | Design tokens, component library, UX guidelines | Token linter, component-only rule, screenshot diff, accessibility | Designer/product review | Không hard-code style, không lệch baseline ngoài ngưỡng, đủ states |\n| Architecture | Spec, ADR, principles, threat model | Dependency rules, architecture tests, security scans | Architect + security + domain lead | ADR duyệt, boundary rõ, rollback path có |\n| Module lớn | Domain map, contracts, data ownership, AGENTS.md | Contract tests, integration tests, E2E flows | Domain owner | Không phá contract, E2E nghiệp vụ đạt |\n| Multi-agent | Ownership map, branch/worktree policy, merge protocol | CI per branch, trace/cost/loop guard | Supervisor/human lead | Không sửa chồng lấn, không merge khi gate fail |\n| Observability | Trace schema, eval taxonomy, alert policy | Sampling, regression suite, cost/latency alerts | Ops/engineering lead | Có trace đầy đủ và failure feedback loop |\n\n## Cách dùng\n\n- Điền matrix ở đầu mỗi initiative lớn.\n- Mỗi hàng phải có ít nhất một guardrail máy kiểm được.\n- Nếu chưa có checkpoint owner, không giao task cho agent.\n- Nếu pass/fail không rõ, chưa đủ điều kiện chạy song song multi-agent.\n\n"
  },
  {
    "id": "docs-04-ui-ux-control-system",
    "category": "Detailed Chapters",
    "subcategory": null,
    "title": "Playbook: Kiểm soát Giao diện & Quy trình Đồng bộ Figma-to-Code",
    "path": "docs/04-ui-ux-control-system.md",
    "content": "# Playbook: Kiểm soát Giao diện & Quy trình Đồng bộ Figma-to-Code\n\nTài liệu này hướng dẫn cách chuyển đổi các nguyên tắc UI/UX từ thẩm mỹ chủ quan trên Figma thành các cổng kiểm soát kỹ thuật tất định, đảm bảo AI Agent tạo ra giao diện chính xác và đồng nhất 100% với thiết kế.\n\n---\n\n## 1. Bản chất: Vì sao AI Agent cần Cổng Kiểm soát UI?\nAI Agent không có mắt vật lý để cảm nhận tính thẩm mỹ hay tỷ lệ khoảng cách. Nếu chỉ ra lệnh bằng prompt mô tả chung chung, giao diện sinh ra sẽ bị phân mảnh, sai lệch spacing, và tự chế component. \n\nGiải pháp là **cưỡng chế tất định (Deterministic Enforcement)**: biến thiết kế Figma thành cấu trúc dữ liệu và thư viện component máy-đọc-được, sau đó dùng linter và kiểm thử visual để ép Agent tuân thủ.\n\n---\n\n## 2. Quy trình 6 bước từ Figma đến Mã nguồn (Figma-to-Code Pipeline)\n\n```mermaid\nflowchart TD\n    F[1. Figma variables & styles] -->|Figma API / Tokens Studio| JSON[2. Design Tokens JSON]\n    JSON -->|Style Dictionary| Style[CSS Variables / Tailwind Config]\n    Style -->|Ràng buộc cứng| Agent[3. AI Agent Coding]\n    Agent -->|Chạy Sandbox| Lint[4. Strict CSS/Tailwind Linter]\n    Lint -->|Fail| AgentFix[Agent tự sửa styles]\n    Lint -->|Pass| VisualQA[5. Playwright Visual Regression Loop]\n    VisualQA -->|Diff > 0.5%| Feedback[Ghép ảnh diff + CSS error log gửi Agent]\n    Feedback --> Agent\n    VisualQA -->|Pass| Portal[6. Designer HITL Portal]\n    Portal -->|Từ chối| Agent\n    Portal -->|Duyệt| Merge[Merge PR]\n```\n\n### Bước 1: Đồng bộ Design Tokens từ Figma\n- Mọi giá trị màu sắc, typography, spacing (margin/padding), border radius, shadow, và z-index được quản lý tập trung trên Figma Variables.\n- Sử dụng các plugin như **Token Studio for Figma** hoặc Figma API để tự động export các biến này thành tệp tin cấu hình thiết kế máy đọc được (`tokens.json`).\n\n### Bước 2: Biên dịch cấu trúc biến thiết kế (Compilation)\n- Tệp `tokens.json` được Style Dictionary biên dịch tự động thành cấu hình hệ thống:\n  - Biến CSS (`:root { --color-primary: #1565c0; }`).\n  - Tailwind Config (`theme: { extend: { spacing: { 'token-md': '16px' } } }`).\n\n### Bước 3: Lập trình dưới ràng buộc của Thư viện Component (Component Allowlist)\n- Cung cấp cho Agent tài liệu đặc tả thư viện component nội bộ có sẵn (Button, TextInput, Modal, Table...) kèm props và các biến thể (variants).\n- **Quy tắc bất biến:** Agent chỉ được lắp ghép UI từ thư viện đã duyệt. Không được viết inline style mới, không được dùng class CSS thuần tự do.\n\n### Bước 4: Lưới lọc mã nguồn tự động (Linting Gates)\n- Cấu hình linter nghiêm ngặt (ví dụ: `eslint-plugin-tailwindcss` hoặc stylelint) chặn hoàn toàn:\n  - Các mã màu hex cứng (ví dụ: chặn `text-[#ff5733]`, bắt buộc dùng `text-primary`).\n  - Các khoảng cách tùy ý (ví dụ: chặn `mt-[13px]`, bắt buộc dùng `mt-token-md`).\n- Nếu linter phát hiện vi phạm, CI/CD lập tức chặn biên dịch và trả lỗi về cho Agent tự chỉnh sửa.\n\n### Bước 5: Vòng lặp Visual QA tự động (Visual Regression Test Loop)\n- CI/CD tự động dựng ứng dụng trong môi trường sandbox và dùng **Playwright** hoặc **Puppeteer** để chụp screenshot giao diện thật.\n- Giao diện được chụp ở 3 viewports chuẩn: Mobile (375px), Tablet (768px), Desktop (1440px) và qua ma trận 5 trạng thái tương tác (`default`, `hover`, `active`, `focus`, `loading`, `error`, `empty`).\n- Tiến hành so sánh điểm ảnh (pixel-by-pixel comparison) với thiết kế mẫu xuất từ Figma.\n- **Vòng lặp sửa lỗi của Agent:** \n  - Nếu tỉ lệ lệch ảnh (visual diff) > **0.5%**, hệ thống tự động sinh ảnh ghép tô đỏ vùng lệch, trích xuất mã CSS lỗi và gửi phản hồi lại cho Agent.\n  - Agent đọc hình ảnh diff và log để sửa code, chạy lại visual test. Tối đa chạy 3 vòng lặp.\n\n### Bước 6: Cổng kiểm duyệt trực quan của Nhà thiết kế (Designer HITL Portal)\n- Sau khi giao diện vượt qua vòng lặp Visual QA tự động, PR được tạo ra kèm báo cáo ảnh diff.\n- PR được đẩy lên một cổng duyệt trực quan (Designer HITL Portal), cho phép designer duyệt hoặc từ chối và ghi lại phản hồi bằng hình ảnh/văn bản. Đóng góp ý kiến này sẽ được đưa vào bộ nhớ/task tiếp theo của Agent.\n\n---\n\n## 3. Các cơ chế kiểm soát tất định (Deterministic Controls)\n\n### Cấu hình Linter cưỡng chế (Example `.eslintrc.json`)\n```json\n{\n  \"plugins\": [\"tailwindcss\"],\n  \"rules\": {\n    \"tailwindcss/no-custom-classname\": \"error\",\n    \"tailwindcss/classnames-order\": \"warn\",\n    \"tailwindcss/no-arbitrary-value\": \"error\"\n  }\n}\n```\n*Rule `no-arbitrary-value: \"error\"` sẽ chặn đứng mọi class tự chế dạng `h-[123px]` hoặc `p-[9px]`, buộc Agent sử dụng biến thiết kế đã chốt.*\n\n### Ma trận trạng thái giao diện bắt buộc (State Matrix)\nMỗi màn hình được Agent dựng phải có tối thiểu các file test case tương ứng với các trạng thái sau để chụp ảnh đối chiếu:\n- `PageName.stories.tsx` (hoặc test script) định nghĩa:\n  - `DefaultState` (Dữ liệu chuẩn).\n  - `LoadingState` (Đang tải).\n  - `EmptyState` (Không có dữ liệu - kiểm tra empty icon & text).\n  - `ErrorState` (Lỗi API - kiểm tra nút retry, thông báo lỗi).\n  - `InteractedState` (Trạng thái hover/active của các nút bấm).\n\n---\n\n## 4. Tiêu chí Pass/Fail đối với Giao diện\n\n- **PASS:**\n  - 100% CSS/Tailwind classes lấy từ Design Tokens của Figma.\n  - Vượt qua linter kiểm tra cứng, không chứa giá trị hard-coded.\n  - Visual regression diff < 0.5% ở tất cả các kích thước màn hình và trạng thái.\n  - Được Designer duyệt và ký nhận (Sign-off) trên HITL Portal.\n\n- **FAIL:**\n  - Tự ý viết CSS inline hoặc class Tailwind tự chế (`mt-[17px]`, `#123456`).\n  - Lệch phông chữ, cỡ chữ, hoặc thiếu trạng thái Responsive.\n  - Thiếu màn hình Loading, Error, hoặc Empty.\n  - Visual regression diff >= 0.5% so với Figma mà chưa được Designer ký duyệt đặc cách.\n"
  },
  {
    "id": "docs-05-architecture-governance",
    "category": "Detailed Chapters",
    "subcategory": null,
    "title": "Architecture Governance",
    "path": "docs/05-architecture-governance.md",
    "content": "# Architecture Governance\n\nKiến trúc là cổng chất lượng trước khi agent implement, không phải kết quả ngẫu nhiên trong lúc coding.\n\n## Architecture Freeze Before Agent Build\n\nTrước khi giao task cho agent, phải có:\n\n- feature spec đã duyệt;\n- ADR cho quyết định khó đảo;\n- module boundary và data ownership rõ;\n- threat model cho vùng rủi ro;\n- rollback path hoặc migration path;\n- test strategy.\n\n## Review đa vai\n\n| Vai | Câu hỏi chính |\n|---|---|\n| Architect | Boundary có rõ không, dependency có đúng chiều không? |\n| Security | Quyền, dữ liệu nhạy cảm, audit trail đã đủ chưa? |\n| Scalability | Bottleneck, state, queue, cache, throughput ra sao? |\n| Maintainability | Testability, versioning, migration, cognitive load thế nào? |\n| Cost | Hạ tầng, token/tool call, vận hành 24/7 có kiểm soát không? |\n| Domain expert | Logic nghiệp vụ và exception flow có đúng không? |\n\n## Không giao cho agent khi\n\n- API/schema/event chưa chốt.\n- Data owner còn mơ hồ.\n- Permission model chưa được duyệt.\n- ADR thiếu alternatives hoặc consequences.\n- Reviewer chưa đồng ý rollback path.\n\n"
  },
  {
    "id": "docs-06-large-module-delivery",
    "category": "Detailed Chapters",
    "subcategory": null,
    "title": "Large Module Delivery",
    "path": "docs/06-large-module-delivery.md",
    "content": "# Large Module Delivery\n\nHệ thống lớn phải được chia theo domain capability và interface contract, không chia tùy tiện theo màn hình hoặc file.\n\n## Bounded context\n\nMỗi bounded context cần có:\n\n- năng lực nghiệp vụ sở hữu;\n- thuật ngữ chính;\n- data ownership;\n- inbound/outbound API;\n- event phát ra và event tiêu thụ;\n- error model;\n- test contract.\n\n## Contract trước implementation\n\nAgent chỉ được implement khi module contract đã rõ:\n\n- input/output;\n- versioning;\n- backward compatibility;\n- idempotency/retry;\n- quyền truy cập;\n- E2E flow liên quan.\n\n## AGENTS.md phân tầng\n\n- Root `AGENTS.md`: nguyên tắc toàn cục, test command, security, coding rules.\n- Module `AGENTS.md`: boundary, domain terms, allowed dependencies, forbidden dependencies.\n- Package `AGENTS.md`: local conventions, known pitfalls, test command.\n\n## Gate\n\n- Contract tests ở biên module.\n- Integration tests giữa module.\n- E2E tests theo kịch bản nghiệp vụ thật.\n- Regression mới cho mỗi bug production.\n\n"
  },
  {
    "id": "docs-07-multi-agent-orchestration",
    "category": "Detailed Chapters",
    "subcategory": null,
    "title": "Playbook: Điều phối Multi-Agent Song song hướng Domain",
    "path": "docs/07-multi-agent-orchestration.md",
    "content": "# Playbook: Điều phối Multi-Agent Song song hướng Domain\n\nTài liệu này hướng dẫn chi tiết mô hình kiến trúc Domain-Driven Multi-Agent (DDMA) để chạy nhiều AI Agent lập trình song song nhằm tăng tốc độ bàn giao dự án lớn, phức tạp, mà vẫn bảo đảm tuyệt đối tính liên kết, đồng bộ và logic nghiệp vụ.\n\n---\n\n## 1. Kiến trúc Tổng thể Domain-Driven Multi-Agent (DDMA)\n\nTrong các hệ thống lớn có nhiều nghiệp vụ đan xen, nếu để nhiều agent cùng tự do sửa đổi mã nguồn sẽ dẫn đến xung đột code (merge conflict), phá vỡ kiến trúc, chồng lấn dữ liệu, và sai lệch logic. \n\nGiải pháp là **chia để trị dựa trên Domain-Driven Design (DDD)** kết hợp **Hợp đồng giao diện (API/Event Contracts)** và **Vòng tranh biện tự động (Agentic Debate Loop)** dưới sự giám sát của Supervisor Agent.\n\n```mermaid\nflowchart TB\n    SUP[Supervisor Agent] -->|Phân rã & gán Task theo Domain| Map[Task Ownership Map]\n    \n    Map -->|Cách ly Worktree A| AgentA[Coding Agent A - Domain Khách Hàng]\n    Map -->|Cách ly Worktree B| AgentB[Coding Agent B - Domain Hóa Đơn]\n    \n    AgentA <-->|Thống nhất Contract trước| SharedContract[(API Spec / Event Schema Registry)]\n    AgentB <-->|Thống nhất Contract trước| SharedContract\n    \n    subgraph ExecutionA[Nhánh A - Sandbox A]\n        AgentA --> CodeA[Code Domain A]\n        CodeA --> PactA[Contract Tests & Unit tests]\n    end\n    \n    subgraph ExecutionB[Nhánh B - Sandbox B]\n        AgentB --> CodeB[Code Domain B]\n        CodeB --> PactB[Contract Tests & Unit tests]\n    end\n    \n    PactA & PactB --> CI[CI Integration Gate]\n    CI -->|Xung đột API / Test Fail| Debate[Agentic Debate Protocol - Tranh biện tự động]\n    Debate -->|Tự điều chỉnh spec thành công| CI\n    Debate -->|Thất bại 3 vòng| Human[Tech Lead HITL Checkpoint]\n    CI -->|Pass E2E & Contracts| Merge[Master Merge Gate]\n```\n\n---\n\n## 2. Ba Trụ cột Kiểm soát Logic và Tính liên kết (Three Pillars of Cohesion)\n\n### Trụ cột 1: Cách ly Không gian làm việc (Workspace Isolation)\nĐể tránh các agent sửa đè code của nhau, chúng tôi áp dụng:\n- **Isolated Git Worktrees:** Mỗi agent hoạt động trên một branch và Git Worktree (thư mục vật lý) độc lập.\n- **Directory Access Lock (Cấm biên):** Định nghĩa ranh giới Bounded Context nghiêm ngặt. Hệ thống pre-commit hooks (ví dụ: Husky) chặn cứng không cho phép Agent sửa đổi các file nằm ngoài thư mục domain được phân quyền trong Task Brief.\n  - *Ví dụ:* Agent A phụ trách domain *Hóa Đơn* chỉ được phép tạo và sửa đổi các file trong `/src/modules/billing/`. Mọi thay đổi ngoài thư mục này sẽ bị git hook từ chối commit.\n- **Database Schema Lock (Khóa cơ sở dữ liệu):** Schema database là bất biến trong suốt quá trình agent lập trình song song. Mọi đề xuất thêm bảng hoặc thay đổi kiểu dữ liệu trường phải được viết thành tệp migration và được Architect (Con người) duyệt trước khi phân phối task cho các agent.\n\n### Trụ cột 2: Contract-First (Hợp đồng trước, Viết code sau)\n- Trước khi bắt tay vào coding, các agent đại diện cho các module giao tiếp phải chốt trước **hợp đồng giao diện (interface contracts)**.\n- Giao diện đồng bộ: OpenAPI Spec (REST), GraphQL Schema, hoặc Protobuf (gRPC).\n- Giao diện bất đồng bộ: Event Schema (Avro/JSON Schema trên Message Broker).\n- Các hợp đồng này được đẩy lên **Shared Contract Registry** chung của dự án làm nguồn sự thật.\n\n### Trụ cột 3: Kiểm thử hợp đồng (Contract Testing / Pact)\n- Để đảm bảo tính đồng bộ logic mà không cần khởi động toàn bộ hệ thống cồng kềnh, các nhánh chạy song song bắt buộc phải triển khai **Consumer-Driven Contract Testing (Pact)**.\n- Domain A (Consumer) định nghĩa kỳ vọng dữ liệu từ Domain B (Provider).\n- Bất kỳ thay đổi nào làm phá vỡ cấu trúc dữ liệu trả về sẽ khiến kiểm thử contract thất bại ngay trên nhánh của agent đó trước khi được phép đẩy PR.\n\n---\n\n## 3. Cơ chế tự động giải quyết xung đột (Agentic Debate Protocol)\n\nKhi các agent chạy song song vô tình thay đổi code làm vỡ contract chung hoặc fail các bài test tích hợp (Integration Tests), hệ thống sẽ khởi động quy trình tranh biện tự động để tự điều chỉnh mà không cần con người can thiệp ngay lập tức:\n\n1. **Khởi động Phòng tranh biện (Initiate Debate Room):**\n   - Supervisor Agent phát hiện kiểm thử contract/tích hợp thất bại.\n   - Supervisor khóa quá trình merge của các nhánh liên quan và kéo các coding agent vào một phòng tranh luận ảo (Debate Room).\n\n2. **Cung cấp ngữ cảnh lỗi (Context Injection):**\n   - Supervisor đưa ra sơ đồ lỗi test, chỉ ra chính xác API/Event spec nào bị vỡ, và log lỗi chi tiết của hệ thống CI/CD.\n\n3. **Căn chỉnh tự động (Auto-Reconciliation):**\n   - **Vòng 1:** Coding Agent A (phía Consumer) trình bày lý do vì sao cần cấu trúc dữ liệu mới để phục vụ tính năng mới. Coding Agent B (phía Provider) phân tích ảnh hưởng đến hệ thống của mình và đề xuất chỉnh sửa tương thích ngược (backward-compatible).\n   - **Vòng 2:** Agent A đồng ý hoặc phản biện, đưa ra phiên bản API Spec cập nhật chung.\n   - **Vòng 3:** Agent B thực thi điều chỉnh mã nguồn tương ứng để khớp với spec mới chốt.\n\n4. **Tích hợp lại (Re-Integration):**\n   - Hệ thống tự động chạy lại CI/CD và bộ test Contract. Nếu pass, Supervisor mở khóa merge PR.\n\n5. **Leo thang (Escalation Gate):**\n   - Nếu sau 3 vòng thảo luận mà các agent không thể thống nhất spec do xung đột logic nghiệp vụ sâu (ví dụ: đòi hỏi cấu trúc DB khác biệt hoàn toàn), Supervisor sẽ đóng băng Debate Room và gửi báo cáo phân tích xung đột (Conflict Analysis Report) lên Technical Lead (Con người) để ra quyết định cuối cùng.\n\n---\n\n## 4. Tiêu chí Pass/Fail đối với Multi-Agent\n\n- **PASS:**\n  - 100% tệp tin sửa đổi nằm đúng ranh giới domain phân quyền.\n  - API/Event contracts được thống nhất, lưu vào registry và vượt qua kiểm thử Contract (Pact).\n  - Tranh biện tự động giải quyết được toàn bộ xung đột API giữa các nhánh.\n  - 100% Unit, Integration, và E2E tests đạt màu xanh trên CI/CD.\n\n- **FAIL:**\n  - Agent sửa đổi code ngoài domain được gán (vượt biên giới).\n  - Thay đổi schema database không có migration được duyệt trước.\n  - Làm hỏng API/Event contract của module khác mà không sửa đổi hoặc tự giải quyết được.\n  - Tranh biện tự động thất bại và trôi nổi mà không escalate kịp thời cho Technical Lead.\n"
  },
  {

    "content": "# Observability, Evals, Governance\n\nAgentic SDLC cần quan sát được, đánh giá được và có kiểm soát quyền hạn.\n\n## Observability\n\nTheo dõi tối thiểu:\n\n- trace từng run;\n- tool calls;\n- số bước/loop;\n- token/cost;\n- latency;\n- failure mode;\n- human escalation.\n\n## Evals\n\nBa lớp đánh giá:\n\n- Unit evals: định dạng, tool call, schema, ground truth.\n- Regression suite: LLM-as-judge hoặc rubric review cho chất lượng chủ quan.\n- Production sampling: lấy mẫu trace thật để bắt drift.\n\n## Governance\n\n- Least privilege cho agent.\n- Scoped credentials.\n- Guardrails đầu vào và đầu ra.\n- HITL cho hành động không hoàn tác.\n- Audit trail cho hành động quan trọng.\n\n## Feedback loop\n\nMỗi lỗi production phải tạo một artifact mới: test, eval, guardrail, checklist item hoặc cập nhật `AGENTS.md`.\n\n"
  },
  {
    "id": "docs-09-adoption-roadmap",
    "category": "Detailed Chapters",
    "subcategory": null,
    "title": "Adoption Roadmap",
    "path": "docs/09-adoption-roadmap.md",
    "content": "# Adoption Roadmap\n\nKhông nên triển khai toàn bộ Agentic SDLC cùng lúc. Bắt đầu từ observability, eval và template trước khi mở rộng multi-agent.\n\n## Giai đoạn 1 - Chuẩn hóa tài liệu\n\n- Dùng feature spec, ADR, module contract và merge gate report.\n- Tạo root `AGENTS.md` cho repo sản phẩm.\n- Bắt đầu checklist UI/UX, architecture và release.\n\n## Giai đoạn 2 - Quality gates\n\n- Thêm contract tests.\n- Thêm visual regression cho màn hình trọng yếu.\n- Thêm eval plan cho agent output.\n- Yêu cầu merge gate report cho PR do agent tạo.\n\n## Giai đoạn 3 - Multi-agent có kiểm soát\n\n- Chạy supervisor + 2-3 sub-agent trên worktree riêng.\n- Dùng ownership map.\n- Chỉ fan-out task khi spec/contract đã rõ.\n\n## Giai đoạn 4 - 24/7 và cải thiện liên tục\n\n- Trace mọi run.\n- Sampling production.\n- Tạo regression từ lỗi thật.\n- Cập nhật template và `AGENTS.md` theo bài học.\n\n"
  },

    "path": "templates/agents/agent-task-brief.md",
    "content": "# Agent Task Brief Template\n\n## Mục tiêu\n\nGiao task cho agent với scope, contract và gate rõ ràng.\n\n## Operating principle\n\nHuman owns intent, architecture, design standard, contracts; agents own execution inside constraints.\n\n## Owner\n\n- Human supervisor:\n- Agent/tool:\n- Reviewer:\n\n## Input bắt buộc\n\n- Feature spec:\n- ADR:\n- UI contract:\n- Module contract:\n- Ownership map:\n- Test/eval expectation:\n\n## Output bắt buộc\n\n- Files/modules allowed:\n- Files/modules forbidden:\n- Implementation steps:\n- Tests/evals to run:\n- Evidence to report:\n- Escalation conditions:\n\n## Checklist pass/fail\n\n- Pass khi agent có thể thực thi mà không tự quyết kiến trúc, UI standard hoặc contract.\n- Fail khi task quá rộng, scope chồng lấn, test không rõ hoặc owner không rõ.\n\n## Reviewer\n\n- Supervisor:\n- Code reviewer:\n- Domain/design/architecture reviewer nếu liên quan:\n\n"

  {
    "id": "templates-agents-merge-gate-report",
    "category": "Operational Templates",
    "subcategory": "Agents",
    "title": "Merge Gate Report Template",
    "path": "templates/agents/merge-gate-report.md",
    "content": "# Merge Gate Report Template\n\n## Mục tiêu\n\nCung cấp bằng chứng trước khi merge thay đổi do agent hoặc multi-agent tạo ra.\n\n## Operating principle\n\nHuman owns intent, architecture, design standard, contracts; agents own execution inside constraints.\n\n## Owner\n\n- Implementation owner:\n- Supervisor:\n- Reviewer:\n\n## Input bắt buộc\n\n- Feature spec link:\n- ADR link:\n- UI contract link nếu có:\n- Module contract link nếu có:\n- Agent task brief:\n- Ownership map nếu multi-agent:\n\n## Output bắt buộc\n\n### Change summary\n\n- What changed:\n- Why:\n- Scope:\n\n### Evidence\n\n- Tests/evals đã chạy:\n- Contract không vỡ:\n- Integration/E2E result:\n- Screenshot diff nếu có UI:\n- Accessibility/responsive result nếu có UI:\n- Security/threat-model check nếu có:\n- Trace/cost/loop evidence nếu có:\n\n### Reviewer approval\n\n| Reviewer | Area | Decision | Notes |\n|---|---|---|---|\n|  | Product/domain |  |  |\n|  | Architecture |  |  |\n|  | Design/UI |  |  |\n|  | Engineering |  |  |\n\n## Checklist pass/fail\n\n- Pass khi bằng chứng đầy đủ và reviewer liên quan đã duyệt.\n- Fail khi thiếu test/eval, contract bị vỡ, screenshot diff chưa duyệt, ADR/spec thiếu link hoặc reviewer chưa approval.\n\n## Reviewer\n\n- Final approver:\n- Required reviewers:\n\n"
  },

    "id": "templates-agents-module-agents",
    "category": "Operational Templates",
    "subcategory": "Agents",
    "title": "Module AGENTS.md Template",
    "path": "templates/agents/module-AGENTS.md",
    "content": "# Module AGENTS.md Template\n\n## Mục tiêu\n\nĐịnh nghĩa ngữ cảnh local cho agent khi làm việc trong một module cụ thể.\n\n## Owner\n\n- Module owner:\n- Domain owner:\n- Engineering owner:\n\n## Input bắt buộc\n\n- Domain boundary:\n- Module contract:\n- Data ownership:\n- Dependency rules:\n- Test commands:\n\n## Output bắt buộc\n\n- Module context:\n- Domain boundary:\n- Contracts:\n- Allowed/forbidden dependencies:\n- Commands:\n- Known pitfalls:\n- Agent rules:\n\n## Module Context\n\n- Module name:\n- Domain capability:\n- Module owner:\n- Domain owner:\n\n## Domain Boundary\n\n- In scope:\n- Out of scope:\n- Key business terms:\n- Business invariants:\n\n## Contracts\n\n- Public APIs:\n- Events emitted:\n- Events consumed:\n- Data owned:\n- Data read-only:\n- Error model:\n\n## Dependencies\n\n- Allowed dependencies:\n- Forbidden dependencies:\n- Dependency direction rules:\n\n## Commands\n\n- Local test command:\n- Contract test command:\n- E2E/eval command:\n- Lint/typecheck command:\n\n## Known Pitfalls\n\n- Pitfall 1:\n- Pitfall 2:\n- Pitfall 3:\n\n## Agent Rules\n\n- Human owns intent, architecture, design standard, contracts; agents own execution inside constraints.\n- Do not change module boundary without ADR/reviewer approval.\n- Do not write data owned by another module.\n- Do not introduce new dependency direction without architecture approval.\n- Escalate if business terminology or error behavior is unclear.\n\n## Checklist pass/fail\n\n- Pass khi agent hiểu rõ module này sở hữu gì, không sở hữu gì, được phụ thuộc vào đâu và phải chạy test nào.\n- Fail khi boundary, dependency, data ownership hoặc command còn mơ hồ.\n\n## Reviewer\n\n- Module owner:\n- Domain owner:\n- Architecture/engineering:\n"

    "content": "# Multi-Agent Ownership Map Template\n\n## Mục tiêu\n\nTránh xung đột khi nhiều agent làm song song.\n\n## Operating principle\n\nHuman owns intent, architecture, design standard, contracts; agents own execution inside constraints.\n\n## Owner\n\n- Supervisor:\n- Engineering lead:\n\n## Input bắt buộc\n\n- Approved spec:\n- ADR/contracts:\n- Task list:\n- Repo/module map:\n\n## Output bắt buộc\n\n| Agent | Branch/worktree | Scope được phép | Scope cấm sửa | Contract liên quan | Required gates | Reviewer |\n|---|---|---|---|---|---|---|\n| Agent A |  |  |  |  |  |  |\n| Agent B |  |  |  |  |  |  |\n\n## Checklist pass/fail\n\n- Pass khi không có scope chồng lấn và mỗi agent có branch/worktree riêng.\n- Fail khi nhiều agent cùng sửa boundary chưa chốt hoặc không có merge order.\n\n## Reviewer\n\n- Supervisor:\n- Architect nếu chạm boundary:\n- Domain/design nếu liên quan:\n\n"

  {
    "id": "templates-agents-root-agents",
    "category": "Operational Templates",
    "subcategory": "Agents",
    "title": "Root AGENTS.md Template",
    "path": "templates/agents/root-AGENTS.md",
    "content": "# Root AGENTS.md Template\n\n## Mục tiêu\n\nĐịnh nghĩa nguyên tắc toàn cục để mọi agent làm việc trong repo không tự quyết kiến trúc, UI standard, contract hoặc scope.\n\n## Operating Principle\n\nHuman owns intent, architecture, design standard, contracts; agents own execution inside constraints.\n\n## Owner\n\n- Engineering lead:\n- Agent supervisor:\n- Architecture owner:\n\n## Input bắt buộc\n\n- Repo architecture overview:\n- Design system contract nếu có UI:\n- Test/eval commands:\n- Security/permission rules:\n- Module ownership map:\n\n## Output bắt buộc\n\n- Global agent rules:\n- Required artifacts before implementation:\n- Quality gates:\n- Forbidden actions:\n- Escalation rules:\n\n## Global Rules\n\n- Do not decide architecture, storage, permission model, API boundary or event schema without approved spec/ADR.\n- Do not create UI outside the design system without approved design/component contract.\n- Do not modify files outside the assigned scope.\n- Do not overlap with another agent's ownership area.\n- Run the tests/evals/checks specified in the task brief.\n- Stop and escalate if requirements, contracts, permissions or data ownership are ambiguous.\n\n## Required Inputs Before Implementation\n\n- Feature spec.\n- ADR for architectural changes.\n- UI contract for UI changes.\n- Module contract for module boundary/API/data changes.\n- Agent task brief.\n- Expected tests/evals.\n\n## Quality Gates\n\n- Unit/integration/contract/E2E tests as applicable.\n- Visual regression and accessibility checks for UI.\n- Security checks for permission/data/tool changes.\n- Merge gate report before merge.\n\n## Forbidden Actions\n\n- Broad refactor outside scope.\n- Silent schema change.\n- Hard-coded UI style outside tokens.\n- Production-impacting action without human approval.\n- Merge when gate fails.\n\n## Checklist pass/fail\n\n- Pass khi agent có đủ rule toàn cục để dừng, hỏi hoặc thực thi trong constraint.\n- Fail khi agent vẫn phải tự đoán kiến trúc, UI standard, quyền, test command hoặc scope.\n\n## Reviewer\n\n- Engineering:\n- Architecture:\n- Security/design nếu liên quan:\n"
  },

    "id": "templates-architecture-adr",
    "category": "Operational Templates",
    "subcategory": "Architecture",
    "title": "ADR Template",
    "path": "templates/architecture/adr.md",
    "content": "# ADR Template\n\n## Mục tiêu\n\nGhi lại quyết định kiến trúc quan trọng trước khi agent implement.\n\n## Owner\n\n- Architect:\n- Engineering owner:\n- Domain owner:\n\n## Input bắt buộc\n\n- Feature spec:\n- Context hệ thống:\n- Ràng buộc phi chức năng:\n- Module/data/API liên quan:\n- Rủi ro đã biết:\n\n## Output bắt buộc\n\n### Context\n\nVấn đề, giả định, ràng buộc và lý do cần quyết định.\n\n### Decision\n\nQuyết định được chọn và phạm vi áp dụng.\n\n### Alternatives\n\nCác phương án bị loại và lý do loại.\n\n### Consequences\n\nTác động tới scale, cost, security, testability, operability và maintainability.\n\n### Rollback path\n\nCách đảo quyết định, giảm thiểu thiệt hại hoặc migration path nếu giả định sai.\n\n## Checklist pass/fail\n\n- Pass khi decision, alternatives, consequences và rollback path rõ.\n- Fail khi agent vẫn phải tự chọn storage, API boundary, event schema, permission model hoặc dependency direction.\n\n## Reviewer\n\n- Architect:\n- Security:\n- Domain:\n- Engineering:\n\n"
  },

    "path": "templates/architecture/architecture-freeze-checklist.md",
    "content": "# Architecture Freeze Checklist\n\n## Mục tiêu\n\nKhóa đủ quyết định kiến trúc trước khi agent build.\n\n## Owner\n\n- Architect:\n- Engineering lead:\n\n## Input bắt buộc\n\n- Feature spec:\n- ADR:\n- Architecture review:\n- Threat model:\n- Module contract:\n\n## Output bắt buộc\n\n- Freeze decision: approved / rejected / needs revision\n- Approved implementation boundaries:\n- Required tests/evals:\n- Rollback/migration path:\n\n## Checklist pass/fail\n\n- [ ] Spec đã duyệt.\n- [ ] ADR đầy đủ context, decision, alternatives, consequences, rollback path.\n- [ ] Module boundary và data ownership rõ.\n- [ ] API/schema/event contract rõ nếu có.\n- [ ] Threat model có mitigation.\n- [ ] Test strategy đã định nghĩa.\n- [ ] Agent task scope có thể viết mà không cần agent tự quyết kiến trúc.\n\n## Reviewer\n\n- Architect:\n- Security:\n- Domain:\n- Engineering:\n\n"

    "content": "# Architecture Review Template\n\n## Mục tiêu\n\nPhản biện kiến trúc đa góc độ trước khi freeze và giao task cho agent.\n\n## Owner\n\n- Architect:\n- Review facilitator:\n\n## Input bắt buộc\n\n- Feature spec:\n- ADR:\n- Domain/module map:\n- Threat model nếu có:\n- Module contract nếu có:\n\n## Output bắt buộc\n\n| Vai review | Nhận xét | Rủi ro | Quyết định |\n|---|---|---|---|\n| Architect |  |  |  |\n| Security |  |  |  |\n| Scalability |  |  |  |\n| Maintainability |  |  |  |\n| Cost |  |  |  |\n| Domain expert |  |  |  |\n\n## Checklist pass/fail\n\n- Pass khi mọi rủi ro P0/P1 có mitigation hoặc owner.\n- Fail khi boundary, data ownership, dependency direction hoặc rollback path chưa rõ.\n\n## Reviewer\n\n- Final approver:\n- Reviewers:\n\n"

    "title": "Threat Model Template",
    "path": "templates/architecture/threat-model.md",
    "content": "# Threat Model Template\n\n## Mục tiêu\n\nXác định rủi ro bảo mật, quyền hạn và dữ liệu trước khi agent thực thi.\n\n## Owner\n\n- Security owner:\n- Engineering owner:\n\n## Input bắt buộc\n\n- Feature spec:\n- Architecture/ADR:\n- Data classification:\n- Tool/API permissions:\n- External integrations:\n\n## Output bắt buộc\n\n| Threat | Impact | Likelihood | Mitigation | Owner |\n|---|---|---|---|---|\n| Prompt injection |  |  |  |  |\n| Tool misuse |  |  |  |  |\n| Excessive privilege |  |  |  |  |\n| Data exposure |  |  |  |  |\n| Unsafe output handling |  |  |  |  |\n\n## Checklist pass/fail\n\n- Pass khi mỗi rủi ro cao có guardrail/eval/alert hoặc HITL.\n- Fail khi agent được cấp quyền rộng, credentials không scoped hoặc hành động không hoàn tác thiếu approval.\n\n## Reviewer\n\n- Security:\n- Engineering:\n- Compliance/domain:\n\n"

    "title": "Data Ownership Template",
    "path": "templates/modules/data-ownership.md",
    "content": "# Data Ownership Template\n\n## Mục tiêu\n\nXác định ai sở hữu dữ liệu, ai được ghi, ai chỉ được đọc.\n\n## Owner\n\n- Data owner:\n- Module owner:\n- Security owner:\n\n## Input bắt buộc\n\n- Domain boundary:\n- Module contract:\n- Data classification:\n- Compliance requirement:\n\n## Output bắt buộc\n\n| Entity/Table/Collection | Owner module | Write access | Read access | Sensitive data | Audit required |\n|---|---|---|---|---|---|\n|  |  |  |  |  |  |\n\n## Checklist pass/fail\n\n- Pass khi mỗi dữ liệu có một owner ghi rõ và quyền truy cập rõ.\n- Fail khi nhiều module cùng ghi một dữ liệu mà không có protocol hoặc audit.\n\n## Reviewer\n\n- Data:\n- Security:\n- Domain:\n- Engineering:\n\n"

    "content": "# Domain Boundary Template\n\n## Mục tiêu\n\nXác định bounded context/domain capability trước khi chia module hoặc giao task cho agent.\n\n## Owner\n\n- Domain owner:\n- Architect:\n- Engineering owner:\n\n## Input bắt buộc\n\n- Product requirement:\n- Current system map:\n- Business terminology:\n- Data/entities liên quan:\n\n## Output bắt buộc\n\n- Domain name:\n- Business capability:\n- In scope:\n- Out of scope:\n- Key terms:\n- Upstream dependencies:\n- Downstream consumers:\n- Data ownership:\n\n## Checklist pass/fail\n\n- Pass khi boundary đủ rõ để viết module contract.\n- Fail khi cùng một entity có nhiều owner, thuật ngữ mơ hồ hoặc workflow xuyên module chưa được mô tả.\n\n## Reviewer\n\n- Domain:\n- Architect:\n- Engineering:\n\n"

    "content": "# Quality Control Matrix Template\n\n## Mục tiêu\n\nÁnh xạ rủi ro sang nguồn sự thật, guardrail, checkpoint và pass/fail.\n\n## Owner\n\n- Engineering lead:\n- Quality owner:\n- Supervisor:\n\n## Input bắt buộc\n\n- Feature spec:\n- Architecture/ADR:\n- UI/module contracts:\n- Agent plan:\n\n## Output bắt buộc\n\n| Khu vực | Nguồn sự thật | Guardrail tự động | Checkpoint con người | Pass/fail |\n|---|---|---|---|---|\n| UI/UX | Design tokens, component library | Token linter, screenshot diff, a11y | Designer/product |  |\n| Architecture | Spec, ADR, threat model | Architecture tests, security scans | Architect/security/domain |  |\n| Module lớn | Domain map, contracts, AGENTS.md | Contract, integration, E2E | Domain/module owner |  |\n| Multi-agent | Ownership map, branch policy | CI per branch, trace/cost guard | Supervisor |  |\n| Observability | Trace schema, eval taxonomy | Sampling, alert, regression | Ops/engineering |  |\n\n## Checklist pass/fail\n\n- Pass khi mỗi rủi ro có guardrail và checkpoint.\n- Fail khi có rủi ro chỉ được mô tả bằng lời nhưng không có kiểm soát.\n\n## Reviewer\n\n- Engineering:\n- Product/domain:\n- Security/design nếu liên quan:\n\n"

    "path": "examples/sample-AGENTS.md",
    "content": "# Sample AGENTS.md\n\n## Operating Principle\n\nHuman owns intent, architecture, design standard, contracts; agents own execution inside constraints.\n\n## Global Rules\n\n- Do not decide architecture without approved ADR.\n- Do not create UI outside the design system.\n- Do not change API/schema/event contracts without reviewer approval.\n- Do not modify files outside assigned scope.\n- Do not overlap with another agent's ownership area.\n- Stop and ask supervisor when scope, contract, data owner or test expectation is unclear.\n\n## Required Artifacts\n\n- Feature spec before implementation.\n- ADR for architecture changes.\n- Component contract for UI changes.\n- Module contract for API/data/event changes.\n- Merge gate report before merge.\n\n## Quality Gates\n\n- Unit tests for local logic.\n- Contract tests for module boundaries.\n- Visual regression and accessibility checks for UI.\n- Security review for permission/data/tool changes.\n- Human review for high-risk or irreversible changes.\n\n"
  },

    "id": "examples-sample-enterprise-feature-adr",
    "category": "Practical Examples",
    "subcategory": "Sample Enterprise Feature",
    "title": "ADR - Approval Dashboard Boundary",
    "path": "examples/sample-enterprise-feature/adr.md",
    "content": "# ADR - Approval Dashboard Boundary\n\n## Mục tiêu\n\nChốt boundary cho feature Approval Dashboard trước khi agent implement.\n\n## Owner\n\n- Architect: Sample Architect\n- Engineering owner: Platform Team\n- Domain owner: Sales Operations\n\n## Context\n\nYêu cầu duyệt chiết khấu đang nằm trong Sales domain. Dashboard mới chỉ được đọc request và gửi quyết định approve/reject qua API đã kiểm quyền.\n\n## Decision\n\nDashboard thuộc module `approval-ui`. Logic quyền và trạng thái request thuộc module `discount-approval`. UI không ghi trực tiếp dữ liệu request.\n\n## Alternatives\n\n- Đưa logic duyệt vào frontend: loại vì dễ bypass quyền.\n- Cho UI ghi thẳng database: loại vì phá data ownership và audit.\n\n## Consequences\n\n- Frontend phụ thuộc API contract của `discount-approval`.\n- Backend phải cung cấp error model rõ cho exceeded-limit, stale-request và forbidden.\n- Audit trail nằm trong backend.\n\n## Rollback path\n\nẨn dashboard bằng feature flag và quay về flow duyệt cũ nếu contract/API có lỗi.\n\n## Checklist pass/fail\n\n- Pass vì data ownership, permission model và rollback path rõ.\n- Fail nếu frontend tự quyết quyền hoặc ghi dữ liệu trực tiếp.\n\n## Reviewer\n\n- Architect: approved\n- Security: approved with audit requirement\n- Domain: approved\n\n"
  },

    "content": "# Agent Task Brief - Approval Dashboard UI\n\n## Operating principle\n\nHuman owns intent, architecture, design standard, contracts; agents own execution inside constraints.\n\n## Owner\n\n- Human supervisor: Frontend Lead\n- Agent/tool: Codex\n- Reviewer: Frontend Lead\n\n## Input bắt buộc\n\n- Feature spec: `feature-spec.md`\n- ADR: `adr.md`\n- UI contract: `ui-component-contract.md`\n- Module contract: `module-contract.md`\n\n## Output bắt buộc\n\n- Allowed scope: approval dashboard UI files and related tests.\n- Forbidden scope: backend permission logic, API schema changes, design token changes.\n- Tests/evals: component tests, accessibility check, visual regression for dashboard states.\n- Escalation: stop if API contract is insufficient or UI requires a new component pattern.\n\n## Checklist pass/fail\n\n- Pass khi implementation không tự quyết architecture, UI standard hoặc module contract.\n- Fail khi agent sửa backend authorization hoặc hard-code style.\n\n## Reviewer\n\n- Supervisor: Frontend Lead\n- Design reviewer: Sample Design Lead\n- Domain reviewer: Sales Operations if workflow changes\n\n"

    "path": "examples/sample-enterprise-feature/feature-spec.md",
    "content": "# Sample Feature Spec - Approval Dashboard\n\n## Mục tiêu\n\nCho phép quản lý duyệt yêu cầu chiết khấu trong một dashboard thống nhất, giảm thời gian xử lý và tránh duyệt sai quyền.\n\n## Owner\n\n- Product owner: Sample Product Lead\n- Domain owner: Sales Operations\n- Engineering owner: Platform Team\n\n## Input bắt buộc\n\n- Người dùng: sales manager.\n- Business outcome: giảm thời gian duyệt yêu cầu chiết khấu.\n- Ràng buộc: không cho phép duyệt nếu vượt hạn mức quyền.\n\n## Output bắt buộc\n\n- Danh sách yêu cầu chờ duyệt.\n- Chi tiết yêu cầu.\n- Hành động approve/reject với lý do.\n- Audit trail cho mọi hành động.\n\n## Acceptance criteria\n\n- [ ] Manager chỉ thấy yêu cầu trong phạm vi quyền.\n- [ ] Yêu cầu vượt hạn mức bị chặn và hiển thị lý do.\n- [ ] Approve/reject ghi audit trail.\n- [ ] UI có loading, empty, error, disabled states.\n\n## Checklist pass/fail\n\n- Pass khi workflow nghiệp vụ, UI, quyền và audit đều rõ.\n- Fail nếu agent phải tự quyết permission model hoặc UI pattern.\n\n## Reviewer\n\n- Product: Sample Product Lead\n- Domain: Sales Operations\n- Engineering: Platform Team\n\n"
