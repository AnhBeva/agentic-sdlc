<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic SDLC — Operating System Portal</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Cổng thông tin quy trình Agentic SDLC - Cẩm nang thiết kế, vận hành, kiểm soát chất lượng và tự cải thiện cho AI Coding Agents và AI nghiệp vụ.">
  <meta name="keywords" content="Agentic SDLC, AI Agent, Software Development Life Cycle, Software Engineering, Observability, OWASP Agentic, DevOps, CI/CD">
  <meta name="author" content="AnhBeva">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  <!-- Markdown, Code Highlighting & Diagrams Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- Prism JS for beautiful Apple-style code highlighting -->
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

  <!-- Mermaid.js for flowcharts, diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>

  <style>
    /* Design Tokens - Clean Premium Apple Light Theme */
    :root {
      --bg-main: #f5f5f7;
      --bg-card: #ffffff;
      --bg-sidebar: rgba(245, 245, 247, 0.88);
      --border-color: rgba(0, 0, 0, 0.08);
      --text-primary: #1d1d1f;
      --text-secondary: #86868b;
      --text-body: #333336;
      --accent: #0066cc;
      --accent-hover: #0077ed;
      --accent-soft: #e8f2fc;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 12px 30px rgba(0, 0, 0, 0.09);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      --font-heading: 'Outfit', -apple-system, sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'Fira Code', monospace;
    }

    /* CSS Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-main);
      color: var(--text-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Main Layout */
    .app-container {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* Sidebar Styling */
    .sidebar {
      width: 320px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-shrink: 0;
      z-index: 100;
      transition: var(--transition);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0066cc, #54a0ff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 4px 10px rgba(0, 102, 204, 0.2);
    }

    .logo-title {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .search-wrapper {
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      background-color: rgba(0, 0, 0, 0.04);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--text-primary);
      transition: var(--transition);
    }

    .search-input:focus {
      outline: none;
      background-color: var(--bg-card);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.12);
    }

    .search-icon-wrapper {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
      width: 16px;
      height: 16px;
    }

    /* Sidebar Nav List */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
    }

    .nav-category {
      margin-bottom: 24px;
    }

    .category-title {
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding-left: 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .nav-item-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      color: var(--text-body);
      font-family: var(--font-body);
      font-size: 13.5px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: var(--transition);
      overflow: hidden;
    }

    .nav-item-btn:hover {
      background-color: rgba(0, 0, 0, 0.04);
      color: var(--text-primary);
    }

    .nav-item-btn.active {
      background-color: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      position: relative;
    }

    .nav-item-btn.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 3px;
      background-color: var(--accent);
      border-radius: 0 4px 4px 0;
    }

    .nav-icon {
      color: var(--text-secondary);
      transition: var(--transition);
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .nav-item-btn.active .nav-icon {
      color: var(--accent);
    }

    /* Subcategory Hierarchical Tree Styling */
    .subcategory-wrapper {
      margin-bottom: 2px;
    }
    
    .nav-subcat-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      color: var(--text-body);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      text-align: left;
    }
    
    .nav-subcat-btn:hover {
      background-color: rgba(0, 0, 0, 0.04);
      color: var(--text-primary);
    }
    
    .subcat-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 2px;
      margin-bottom: 6px;
    }
    
    .nav-item-btn.indent {
      padding-left: 28px;
      font-size: 13px;
    }
    
    .subcat-count {
      font-size: 10px;
      background-color: rgba(0, 0, 0, 0.05);
      color: var(--text-secondary);
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 600;
    }
    
    .nav-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-grow: 1;
    }

    /* Main Area Styling */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: var(--bg-card);
      overflow: hidden;
      position: relative;
    }

    /* Top Bar Header */
    .topbar {
      height: 64px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      background-color: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 50;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .menu-toggle-btn {
      display: none;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-primary);
      width: 24px;
      height: 24px;
    }

    .breadcrumbs {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .breadcrumb-sep {
      color: #d2d2d7;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-body);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .action-btn:hover {
      background-color: var(--bg-main);
      border-color: #d2d2d7;
      color: var(--text-primary);
    }

    /* Document Layout */
    .document-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      width: 100%;
    }

    .content-container {
      flex: 1;
      overflow-y: auto;
      padding: 48px;
      scroll-behavior: smooth;
    }

    .article-wrapper {
      max-width: 800px;
      margin: 0 auto;
    }

    /* Table of Contents */
    .toc-wrapper {
      width: 260px;
      border-left: 1px solid var(--border-color);
      padding: 32px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-shrink: 0;
    }

    .toc-title {
      font-family: var(--font-heading);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .toc-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toc-link {
      font-size: 13px;
      color: var(--text-body);
      text-decoration: none;
      transition: var(--transition);
      cursor: pointer;
      display: block;
      border-left: 2px solid transparent;
      padding-left: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toc-link:hover {
      color: var(--accent);
    }

    .toc-link.active {
      color: var(--accent);
      font-weight: 600;
      border-left-color: var(--accent);
    }

    .toc-link.indent-h3 {
      padding-left: 20px;
    }

    /* Dynamic Cockpit Dashboard styles */
    .dashboard-container {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding-bottom: 60px;
    }

    .dashboard-hero {
      background: linear-gradient(135deg, #ffffff, #f5f5f7);
      border: 1px solid var(--border-color);
      padding: 48px;
      border-radius: var(--radius-lg);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .dashboard-hero::after {
      content: '';
      position: absolute;
      top: -150px;
      right: -150px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 102, 204, 0.05) 0%, rgba(255,255,255,0) 70%);
      pointer-events: none;
    }

    .dashboard-hero h1 {
      font-family: var(--font-heading);
      font-size: 34px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
      letter-spacing: -0.8px;
    }

    .dashboard-hero p {
      font-size: 15.5px;
      color: var(--text-secondary);
      max-width: 600px;
      line-height: 1.5;
    }

    .dashboard-section-title {
      font-family: var(--font-heading);
      font-size: 19px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.3px;
    }

    /* Card Grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
    }

    .metric-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .metric-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent);
    }

    .metric-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .metric-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background-color: var(--bg-main);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .metric-count {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .metric-title {
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .metric-desc {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    /* Interactive Phase Timeline Flow */
    .phase-timeline-container {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: var(--bg-card);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .phase-steps-bar {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
      background-color: #fafafc;
    }

    .phase-step-btn {
      flex: 1;
      min-width: 110px;
      padding: 16px 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      border-right: 1px solid var(--border-color);
    }

    .phase-step-btn:last-child {
      border-right: none;
    }

    .phase-step-btn:hover {
      background-color: rgba(0, 0, 0, 0.02);
    }

    .phase-step-btn.active {
      background-color: var(--bg-card);
      box-shadow: inset 0 -3px 0 0 var(--accent);
    }

    .phase-number {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      transition: var(--transition);
    }

    .phase-step-btn.active .phase-number {
      background-color: var(--accent);
      color: white;
    }

    .phase-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-align: center;
      white-space: nowrap;
    }

    .phase-step-btn.active .phase-name {
      color: var(--accent);
      font-weight: 700;
    }

    .phase-content-panel {
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: #ffffff;
    }

    .phase-panel-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .phase-panel-title {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .phase-panel-desc {
      font-size: 13.5px;
      color: var(--text-secondary);
    }

    .phase-links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }

    .phase-links-column {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 16px;
      background-color: #fafafc;
    }

    .column-title {
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .column-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      list-style: none;
    }

    .inline-link-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 8px;
      border-radius: 4px;
      transition: var(--transition);
      background-color: transparent;
      border: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
    }

    .inline-link-btn:hover {
      background-color: var(--accent-soft);
    }

    .empty-state-text {
      font-size: 13px;
      color: var(--text-secondary);
      font-style: italic;
      padding-left: 8px;
    }

    /* Decision Helper Matrix */
    .decision-helper-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .decision-row {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .decision-row:hover {
      border-color: rgba(0, 102, 204, 0.4);
    }

    .decision-header {
      width: 100%;
      padding: 18px 24px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
    }

    .decision-header-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .decision-title {
      font-family: var(--font-heading);
      font-size: 15.5px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .decision-subtitle {
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .decision-body {
      display: none;
      padding: 0 24px 24px 24px;
      border-top: 1px solid var(--border-color);
      background-color: #fafafc;
      flex-direction: column;
      gap: 16px;
    }

    .decision-resources-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 8px;
    }

    .decision-arrow {
      width: 16px;
      height: 16px;
      color: var(--text-secondary);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .decision-row.open .decision-arrow {
      transform: rotate(90deg);
      color: var(--accent);
    }

    .decision-row.open .decision-body {
      display: flex;
    }

    /* Markdown styling (Apple style) */
    .markdown-body {
      font-family: var(--font-body);
      font-size: 15.5px;
      color: var(--text-body);
      line-height: 1.7;
      display: none;
    }

    .markdown-body h1 {
      font-family: var(--font-heading);
      font-size: 30px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 24px;
      letter-spacing: -0.8px;
      line-height: 1.25;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .markdown-body h2 {
      font-family: var(--font-heading);
      font-size: 21px;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 40px;
      margin-bottom: 16px;
      letter-spacing: -0.4px;
      line-height: 1.3;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      padding-bottom: 8px;
    }

    .markdown-body h3 {
      font-family: var(--font-heading);
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 24px;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .markdown-body p {
      margin-bottom: 20px;
    }

    .markdown-body a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid transparent;
      transition: var(--transition);
    }

    .markdown-body a:hover {
      border-bottom-color: var(--accent);
    }

    /* Lists styling */
    .markdown-body ul, .markdown-body ol {
      margin-bottom: 20px;
      padding-left: 24px;
    }

    .markdown-body li {
      margin-bottom: 8px;
    }

    .markdown-body li > ul, .markdown-body li > ol {
      margin-top: 8px;
      margin-bottom: 0;
    }

    /* checklists */
    .markdown-body ul li input[type="checkbox"] {
      margin-right: 8px;
      accent-color: var(--accent);
      transform: scale(1.1);
      vertical-align: middle;
      position: relative;
      top: -1px;
    }

    /* Blockquotes */

  {
    "id": "agentic_sdlc_deep_dive",

    "title": "Agentic SDLC — Hiểu sâu bản chất, vận hành 24/7, giám sát, đánh giá & kiểm soát",
    "path": "Agentic_SDLC_Deep_Dive.md",
    "content": "# Agentic SDLC — Hiểu sâu bản chất, vận hành 24/7, giám sát, đánh giá & kiểm soát\n\n> Tài liệu tổng hợp tư duy mới nhất (2025–2026) về vòng đời phát triển và vận hành hệ thống agentic, áp dụng cho **cả coding agents lẫn agent nghiệp vụ**. Mục tiêu: để một AI agent hoạt động **ổn định liên tục 24/7**, có **cơ chế giám sát**, **tự cải thiện**, và **chất lượng xuất sắc**.\n\n---\n\n## 0. Cách đọc tài liệu này\n\n> [!TIP]\n> Để có cái nhìn trực quan và nhanh chóng nhất về toàn bộ quy trình, hãy bắt đầu bằng việc xem [Bản đồ Quy trình trực quan (Master Visual Map)](Agentic_SDLC_Master_Map.md) với 6 sơ đồ Mermaid chi tiết.\n\nTài liệu đi theo bốn trụ cột bạn ưu tiên:\n\n1. **Nguyên lý & bản chất** — vì sao agentic *khác* SDLC truyền thống.\n2. **Vận hành 24/7 & giám sát** — observability, error recovery, orchestration.\n3. **Đánh giá & chất lượng** — evals, LLM-as-judge, regression, CI/CD gating.\n4. **Kiểm soát & an toàn** — governance, OWASP agentic, guardrails, quyền hạn.\n\nCuối cùng là **lộ trình triển khai** và **checklist trưởng thành (maturity)**.\n\n---\n\n## 1. Bản chất: Agentic SDLC là gì và khác gì?\n\n### 1.1. Định nghĩa\n\n**Agentic SDLC** là mô hình phát triển/vận hành phần mềm trong đó **AI agent tham gia có ý nghĩa xuyên suốt toàn bộ vòng đời** — lập kế hoạch, viết code, review, ship, và vận hành — thay vì chỉ đứng ở một điểm chốt (như autocomplete). Điểm phân biệt cốt lõi: agent **theo đuổi mục tiêu qua nhiều bước mà không cần con người chỉ đạo từng bước một**.\n\nĐây là sự dịch chuyển từ *AI-assisted* (con người lái, AI gợi ý) sang *AI-executed* (agent tự thực thi giữa các điểm chốt do con người định nghĩa).\n\n### 1.2. Ba thay đổi nền tảng so với SDLC cũ\n\n| Khía cạnh | SDLC truyền thống | Agentic SDLC |\n|---|---|---|\n| Bản chất hệ thống | Tất định (deterministic) | **Xác suất (probabilistic)** — cùng input có thể ra output khác nhau |\n| Đơn vị điều khiển | Code path tường minh | **Đặc tả ý định (intent specification)** + ràng buộc |\n| Mô hình giao hàng | Ship một lần rồi bảo trì | **Học liên tục** — quan sát → sửa → cải thiện |\n| Vai trò con người | Thực thi từng bước | **Định hướng + duyệt tại checkpoint** trên các luồng tác động cao |\n| Sai lỗi điển hình | Bug logic, crash | **Loop vô hạn, gọi sai tool, context bị cắt, lệch mục tiêu** |\n\n> Tư tưởng chủ đạo: vì hệ thống *phi tất định*, ta không thể \"test một lần rồi yên tâm\". Phải thiết kế để **chấp nhận bất định** — ưu tiên *quan sát và hiệu chỉnh* hơn là *giao hàng một lần*.\n\n### 1.3. Nguyên lý thiết kế cốt lõi\n\n1. **Tự trị có điểm chốt (Autonomy with checkpoints):** agent hoàn tất công việc nhiều bước *giữa* các điểm review do con người định nghĩa — không phải tự do tuyệt đối, cũng không phải duyệt từng bước.\n2. **Đặc tả ý định thay vì điều khiển tất định:** mô tả *mục tiêu, ràng buộc, tiêu chí thành công*; để agent tìm đường thực thi.\n3. **Quan sát được (Observability-first):** mọi quyết định của agent phải để lại dấu vết (trace) đầy đủ.\n4. **Học liên tục (Continuous learning):** hệ thống cải thiện theo thời gian dựa trên kết quả thực tế, không \"đóng băng\" sau khi deploy.\n5. **Quyền hạn tối thiểu (Least privilege):** agent chỉ được cấp đúng quyền/tool cần thiết cho nhiệm vụ.\n\n---\n\n## 2. Vòng đời Agentic (ADLC) — sơ đồ tổng quan\n\nThay cho mô hình thác nước/agile tuyến tính, vòng đời agentic là **một vòng lặp khép kín có học hỏi**.\n\n> [!NOTE]\n> Chi tiết về phân vai con người/đại lý, artifact đầu ra đầu vào của từng pha, vui lòng tham khảo [Bản đồ Quy trình trực quan (Sơ đồ 1 - Master Landscape Map)](Agentic_SDLC_Master_Map.md#1-bản-đồ-toàn-cảnh-quy-trình-agentic-sdlc-master-landscape-map). Để xem luồng tương tác thực tế giữa các vai trò theo thời gian, xem [Sơ đồ Trình tự (Sơ đồ 2)](Agentic_SDLC_Master_Map.md#2-sơ-đồ-trình-tự-phát-triển-tính-năng-feature-development-sequence-diagram) và [Sơ đồ Trạng thái Nhiệm vụ (Sơ đồ 3)](Agentic_SDLC_Master_Map.md#3-sơ-đồ-trạng-thái-nhiệm-vụ-của-agent-agent-task-lifecycle-state-diagram).\n\n```mermaid\nflowchart LR\n    A[1. Đặc tả ý định<br/>Intent & ràng buộc] --> B[2. Lập kế hoạch<br/>Planning & phân rã]\n    B --> C[3. Thực thi<br/>Build / Code / Hành động]\n    C --> D[4. Kiểm thử & Eval<br/>Validation]\n    D --> E[5. Review & Duyệt<br/>Human checkpoint]\n    E --> F[6. Triển khai<br/>Deploy / Ship]\n    F --> G[7. Vận hành & Quan sát<br/>Operate 24/7]\n    G --> H[8. Học & Tự cải thiện<br/>Continuous learning]\n    H -.phản hồi.-> A\n    G -.sự cố / drift.-> D\n    E -.từ chối / sửa.-> B\n\n    style A fill:#e3f2fd,stroke:#1565c0\n    style E fill:#fff3e0,stroke:#e65100\n    style G fill:#e8f5e9,stroke:#2e7d32\n    style H fill:#f3e5f5,stroke:#6a1b9a\n```\n\n**Giải thích từng pha:**\n\n- **(1) Đặc tả ý định** — viết rõ mục tiêu, tiêu chí \"định nghĩa hoàn thành\" (DoD), ràng buộc an toàn, ngân sách (token/thời gian/chi phí).\n- **(2) Lập kế hoạch** — agent phân rã nhiệm vụ thành bước nhỏ, chọn tool, ước lượng rủi ro.\n- **(3) Thực thi** — agent hành động: viết code / gọi API / thao tác dữ liệu.\n- **(4) Kiểm thử & Eval** — chạy unit eval, kiểm tra máy-xác-minh-được, LLM-as-judge.\n- **(5) Review & duyệt** — con người duyệt tại các điểm tác động cao (HITL).\n- **(6) Triển khai** — ship có cổng chất lượng (eval-gated release).\n- **(7) Vận hành 24/7** — chạy liên tục, được giám sát qua trace + metrics.\n- **(8) Học & tự cải thiện** — đúc kết từ kết quả, tinh chỉnh skill/prompt/memory.\n\n---\n\n## 3. Kiến trúc một AI agent vận hành liên tục\n\n> [!NOTE]\n> Để xem sơ đồ kiến trúc mở rộng và chi tiết hơn về các lớp kiểm soát, giám sát và tự khắc phục lỗi, xem [Sơ đồ Kiến trúc Vận hành 24/7 & Xử lý lỗi (Sơ đồ 4)](Agentic_SDLC_Master_Map.md#4-sơ-đồ-kiến-trúc-vận-hành-247-xử-lý-lỗi-247-operation-error-recovery-architecture).\n\n```mermaid\nflowchart TB\n    subgraph CORE[Lõi Agent]\n        P[Planner / Reasoner<br/>lập kế hoạch & suy luận]\n        M[Memory<br/>ngắn hạn + dài hạn]\n        TL[Tool Layer<br/>API / code / truy vấn]\n        P <--> M\n        P <--> TL\n    end\n\n    subgraph CTRL[Lớp Kiểm soát]\n        G1[Guardrails đầu vào<br/>chống prompt injection]\n        G2[Policy & Quyền hạn<br/>least privilege]\n        G3[Guardrails đầu ra<br/>kiểm duyệt hành động]\n    end\n\n    subgraph OBS[Lớp Quan sát]\n        TR[Tracing<br/>OpenTelemetry GenAI]\n        EV[Evals online<br/>sampling production]\n        AL[Alerting & Dashboard]\n    end\n\n    subgraph LOOP[Vòng điều khiển vận hành]\n        SC[Scheduler / Orchestrator]\n        ER[Error Recovery<br/>retry / fallback / circuit breaker]\n        HI[Human-in-the-loop<br/>escalation]\n    end\n\n    IN[Sự kiện / Yêu cầu] --> G1 --> CORE\n    CORE --> G3 --> OUT[Hành động / Kết quả]\n    G2 -.kiểm soát.-> TL\n    CORE --> TR --> EV --> AL\n    SC --> CORE\n    CORE -.lỗi.-> ER -.không tự xử được.-> HI\n    AL -.bất thường.-> HI\n\n    style CORE fill:#e3f2fd,stroke:#1565c0\n    style CTRL fill:#ffebee,stroke:#c62828\n    style OBS fill:#e8f5e9,stroke:#2e7d32\n    style LOOP fill:#fff3e0,stroke:#e65100\n```\n\nBốn lớp tách bạch — **Lõi**, **Kiểm soát**, **Quan sát**, **Vòng vận hành** — là xương sống để agent chạy bền bỉ. Nguyên tắc: *lõi có thể sai, nhưng các lớp bao quanh phải bắt được cái sai đó.*\n\n---\n\n## 4. Vận hành 24/7 & cơ chế giám sát\n\n### 4.1. Vì sao giám sát truyền thống (APM) không đủ\n\nĐây là điểm mấu chốt cho mục tiêu \"ổn định liên tục\" của bạn:\n\n> Một agent **loop vô hạn, gọi sai tool, hoặc bịa kết quả (hallucinate) vẫn có thể trả về phản hồi \"thành công\" với độ trễ bình thường.** Công cụ APM truyền thống nhìn vào latency/error-rate sẽ **không phát hiện** được các lỗi này.\n\nPhần lớn sự cố agent đến từ **tool-call thất bại, context bị cắt cụt (truncation), và vòng lặp chạy hoang (runaway loop)** — chứ không phải lỗi của model. Do đó cần **agent-aware instrumentation** (đo đạc hiểu ngữ nghĩa agent).\n\n### 4.2. Tracing: ghi lại toàn bộ chuỗi quyết định\n\nMỗi lần agent chạy phải sinh ra một **trace** ghi lại: tool nào được gọi, context nào được lấy, agent suy luận qua từng bước ra sao, và output cuối có đạt ngưỡng chất lượng không.\n\n**Khuyến nghị kỹ thuật:**\n- Dùng **OpenTelemetry semantic conventions for GenAI** để trace *vendor-agnostic* (không khóa cứng vào một nhà cung cấp, dễ đổi/chồng nền tảng).\n- Dùng native adapter cho framework đang dùng (OpenAI Agents SDK, LangGraph, Mastra, Pydantic AI, LangChain, CrewAI, Vercel AI SDK); với stack tự xây thì OTel là fallback. Cả hai phải xuất trace **cùng một schema**.\n\n### 4.3. Ba \"tín hiệu sống\" cần theo dõi liên tục\n\n```mermaid\nflowchart LR\n    subgraph S[Tín hiệu giám sát 24/7]\n        direction TB\n        Q[Chất lượng<br/>đúng mục tiêu? hallucination?]\n        C[Chi phí<br/>token / call / $ mỗi nhiệm vụ]\n        L[Độ trễ & độ tin cậy<br/>latency, tool success rate]\n    end\n    S --> D{Vượt ngưỡng?}\n    D -->|Có| A[Alert + Escalate HITL]\n    D -->|Không| K[Tiếp tục + sampling eval]\n```\n\n| Nhóm tín hiệu | Ví dụ chỉ số | Vì sao quan trọng |\n|---|---|---|\n| **Chất lượng** | tỉ lệ hoàn thành nhiệm vụ, tỉ lệ hallucination, độ trôi (drift) | bắt lỗi \"thành công giả\" |\n| **Chi phí** | token/nhiệm vụ, số tool-call, $ /ngày | tránh \"đốt tiền\" khi chạy 24/7 |\n| **Độ tin cậy** | tool-call success rate, số lần loop, độ sâu retry | bắt runaway loop & tool fail |\n\n### 4.4. Error recovery — để agent \"tự đứng dậy\"\n\nĐể chạy liên tục không cần người trực, agent cần các cơ chế phục hồi:\n\n- **Retry có giới hạn + backoff:** thử lại tool fail, nhưng có trần để tránh loop.\n- **Fallback:** đổi tool/model/route khác khi đường chính hỏng.\n- **Circuit breaker:** ngắt mạch khi một dependency liên tục lỗi, tránh lan rộng.\n- **Loop/budget guard:** giới hạn số bước, token, thời gian cho một nhiệm vụ; vượt thì dừng & escalate.\n- **Checkpoint & resume:** lưu trạng thái để khôi phục sau gián đoạn (đặc biệt với nhiệm vụ dài nhiều ngày).\n- **Escalation tới con người:** khi agent không tự xử được, chuyển cho HITL thay vì \"đoán bừa\".\n\n### 4.5. Orchestration cho hoạt động liên tục\n\nCác hành vi giá trị cao nhất — **học liên tục, ngữ cảnh bền vững, thực thi 24/7** — *không tương thích* với mô hình chạy cục bộ kiểu bật-tắt. Vận hành 24/7 nên dựa trên **thiết kế cloud-native**: scheduler kích hoạt nhiệm vụ theo lịch/sự kiện, memory bền vững xuyên phiên, và state được lưu trữ tập trung.\n\n---\n\n## 5. Đánh giá & chất lượng — làm sao đạt \"xuất sắc nhất\"\n\nChất lượng agentic không đến từ một lần test, mà từ **hệ thống đánh giá nhiều lớp, chạy liên tục**.\n\n### 5.1. Ba lớp đánh giá bắt buộc\n\n```mermaid\nflowchart TB\n    U[Lớp 1 — Unit Evals<br/>kiểm từng bước rời rạc<br/>máy xác minh được] --> R[Lớp 2 — Regression Suite<br/>LLM-as-judge cho chất lượng chủ quan<br/>chạy tự động hằng đêm]\n    R --> P[Lớp 3 — Production Trace Sampling<br/>lấy mẫu trace thực tế<br/>bắt drift ngoài đời]\n    P -.phát hiện ca lỗi mới.-> U\n    style U fill:#e3f2fd,stroke:#1565c0\n    style R fill:#fff3e0,stroke:#e65100\n    style P fill:#e8f5e9,stroke:#2e7d32\n```\n\n1. **Unit evals** — kiểm các bước rời rạc bằng cách *máy xác minh được* (deterministic checks): đúng định dạng, gọi đúng tool, kết quả khớp ground-truth.\n2. **LLM-as-judge regression suite** — dùng một LLM mạnh chấm chất lượng *chủ quan* (mạch lạc, hữu ích, đúng ý định) cho các output khó định lượng; chạy **regression tự động hằng đêm**.\n3. **Production trace sampling liên tục** — lấy mẫu trace thật để bắt **drift** mà bộ test offline không thấy. Đây là vòng phản hồi đưa ca lỗi mới về làm test case.\n\n### 5.2. LLM-as-judge: mạnh nhưng phải kỷ luật\n\n- **Bản chất:** dùng một LLM mạnh để chấm/xếp hạng output của agent, mô phỏng người đánh giá — cho phép **đánh giá ở quy mô lớn**.\n- **Giới hạn quan trọng:** judge cũng có thiên lệch. **Không được thay thế hoàn toàn con người.** Phải *meta-evaluate* chính judge (kiểm tra judge có chấm đúng không).\n- **Best practice — đánh giá lai (hybrid):** kết hợp **kiểm tra tất định/thống kê** + **LLM-as-judge**, tránh phụ thuộc vào một thước đo duy nhất. Dùng **review người có mục tiêu trên các luồng tác động cao** để *hiệu chỉnh (calibrate)* judge cho khớp chuẩn sản phẩm.\n- Một biến thể mới là **Agent-as-a-Judge**: dùng chính agent để đánh giá agent, bổ trợ (không thay thế) giám sát con người.\n\n### 5.3. Cổng chất lượng trong CI/CD (eval-gated release)\n\nĐể chất lượng không tụt khi cập nhật:\n\n- Chạy eval **tự động trên mỗi thay đổi code** (ví dụ tích hợp GitHub Actions).\n- **Chặn (gate) release** nếu thay đổi làm *giảm* điểm chất lượng so với baseline.\n- Báo cáo regression hằng đêm để phát hiện sớm sa sút.\n\n```mermaid\nflowchart LR\n    Dev[Thay đổi prompt/code/tool] --> CI[CI chạy eval suite]\n    CI --> Gate{Điểm >= baseline?}\n    Gate -->|Đạt| Ship[Cho phép deploy]\n    Gate -->|Không đạt| Block[Chặn + báo cáo regression]\n    Ship --> Prod[Production]\n    Prod --> Sample[Sampling trace] --> CI\n```\n\n### 5.4. Taxonomy \"đo cái gì\"\n\nMột kỷ luật quan trọng: có **bảng phân loại rõ ràng về cái cần đo**. Gợi ý các chiều:\n- **Task success** (hoàn thành đúng mục tiêu)\n- **Trung thực / không bịa** (faithfulness, grounding)\n- **Tuân thủ quy trình** (gọi đúng tool theo đúng thứ tự)\n- **An toàn** (không vi phạm policy)\n- **Hiệu quả** (chi phí/độ trễ hợp lý)\n- **Trải nghiệm** (mạch lạc, đúng giọng điệu).\n\n---\n\n## 6. Kiểm soát & an toàn (Governance)\n\n### 6.1. OWASP Top 10 for Agentic Applications (bản 2025/2026)\n\nKhung rủi ro tham chiếu hàng đầu cho agent. Bản 2026 tập trung vào các thất bại từ *goal misalignment, tool misuse, delegated trust, giao tiếp giữa các agent, bộ nhớ bền vững, và hành vi tự trị nổi lên (emergent)*. Một số rủi ro tiêu biểu:\n\n| Rủi ro | Mô tả ngắn | Biện pháp giảm thiểu |\n|---|---|---|\n| **Agent Goal Hijack** | mục tiêu bị chiếm/lệch hướng | đặc tả ý định rõ, kiểm tra mục tiêu định kỳ |\n| **Tool Misuse & Exploitation** | lạm dụng/khai thác tool | allowlist tool, sandbox, xác thực tham số |\n| **Identity & Privilege Abuse** | lạm quyền danh tính | least privilege, scoped credentials, audit |\n| **Prompt Injection** | input độc chiếm điều khiển | guardrails đầu vào, tách dữ liệu khỏi lệnh |\n| **Excessive Agency** | agent được trao quá nhiều quyền tự quyết | giới hạn hành động, HITL cho hành động rủi ro |\n| **Insecure Output Handling** | output không kiểm duyệt gây hại | guardrails đầu ra, kiểm tra trước khi thực thi |\n| **Memory Poisoning** | đầu độc bộ nhớ dài hạn | xác thực nguồn ghi vào memory, cách ly |\n\n> Nguyên tắc thực hành: **ánh xạ từng rủi ro OWASP sang một biện pháp eval/guardrail/alert cụ thể.** Mỗi rủi ro phải có \"người gác cổng\".\n\n### 6.2. Guardrails — hai tầng\n\n```mermaid\nflowchart LR\n    IN[Đầu vào] --> GI[Guardrail vào<br/>lọc injection, kiểm policy, phân loại ý định]\n    GI --> AGENT[Agent thực thi]\n    AGENT --> GO[Guardrail ra<br/>kiểm duyệt nội dung, chặn hành động nguy hiểm, PII]\n    GO --> OUT[Hành động/Kết quả]\n    GI -.vi phạm.-> REJ[Từ chối / Escalate]\n    GO -.vi phạm.-> REJ\n```\n\n### 6.3. Quản trị quyền hạn & danh tính\n\n- **Least privilege:** agent chỉ có đúng tool & quyền tối thiểu cho nhiệm vụ.\n- **Scoped, short-lived credentials:** token có phạm vi hẹp, hết hạn nhanh.\n- **Phân tách môi trường:** sandbox cho hành động rủi ro; production tách biệt.\n- **Audit trail bất biến:** mọi hành động ghi log không sửa được để truy vết & tuân thủ.\n- **Human approval cho hành động không thể hoàn tác:** xóa dữ liệu, chuyển tiền, gửi ra ngoài… phải qua duyệt.\n\n### 6.4. Con người ở đâu trong vòng lặp? (HITL)\n\nHITL là *không thể thiếu* cho các kịch bản tác động cao. Vai trò con người:\n- Đánh giá **chuỗi suy luận** của agent và sự *mạch lạc của workflow nhiều bước*.\n- Kiểm tra **khớp với yêu cầu nghiệp vụ**.\n- **Hiệu chỉnh judge** và chuẩn chất lượng qua review có mục tiêu trên luồng tác động cao.\n\nCách bố trí HITL theo mức rủi ro:\n\n```mermaid\nflowchart TB\n    T{Mức rủi ro hành động}\n    T -->|Thấp / hoàn tác được| AUTO[Tự động hoàn toàn<br/>+ sampling kiểm tra sau]\n    T -->|Trung bình| ASYNC[Tự động + review bất đồng bộ<br/>spot-check]\n    T -->|Cao / không hoàn tác được| SYNC[Bắt buộc duyệt trước khi thực thi]\n    style AUTO fill:#e8f5e9,stroke:#2e7d32\n    style ASYNC fill:#fff3e0,stroke:#e65100\n    style SYNC fill:#ffebee,stroke:#c62828\n```\n\n---\n\n## 7. Tự cải thiện (Self-improvement)\n\n> [!NOTE]\n> Xem chi tiết sơ đồ luồng dữ liệu, đánh giá sandbox và cơ chế triển khai của quy trình này tại [Sơ đồ Vòng lặp Tự cải thiện liên tục (Sơ đồ 5)](Agentic_SDLC_Master_Map.md#5-sơ-đồ-vòng-lặp-tự-cải-thiện-liên-tục-continuous-self-improvement-loop).\n\nMục tiêu \"tự cải thiện\" của bạn đã có nhiều hướng *đang chạy thực tế trong 2026*:\n\n- **Tinh chỉnh skill theo kết quả:** agent tạo & tinh chỉnh \"kỹ năng\" riêng dựa trên kết quả nhiệm vụ; quan sát thấy hiệu năng *cải thiện theo tuần* trên các loại nhiệm vụ lặp lại.\n- **Hướng tiến hóa (evolutionary):** AlphaEvolve, ShinkaEvolve — tiến hóa lời giải/chiến lược.\n- **Học tăng cường (RL):** SWE-RL, SAGE — học từ phần thưởng/kết quả.\n- **Hệ thống bộ nhớ (memory):** Mem0, MemOS, SimpleMem — tích lũy & tái dùng kinh nghiệm.\n\nBằng chứng quy mô: một framework \"Deep Researcher Agent\" đã hoàn thành **500+ chu kỳ thí nghiệm** trên 4 dự án song song trong **hơn 30 ngày**, đạt **~52% cải thiện so với baseline** — minh chứng cho vòng lặp tự cải thiện chạy liên tục.\n\n### 7.1. Vòng lặp tự cải thiện an toàn\n\n```mermaid\nflowchart LR\n    R[Kết quả thực tế + trace] --> A[Phân tích thất bại<br/>failure analysis]\n    A --> H[Đề xuất cải thiện<br/>prompt / skill / memory / tool]\n    H --> S[Thử nghiệm trong sandbox<br/>+ eval offline]\n    S --> G{Tốt hơn baseline & an toàn?}\n    G -->|Có| D[Triển khai dần<br/>canary / A-B]\n    G -->|Không| X[Loại bỏ]\n    D --> R\n    style S fill:#fff3e0,stroke:#e65100\n    style G fill:#ffebee,stroke:#c62828\n```\n\n> Cảnh báo: tự cải thiện *không kiểm soát* là rủi ro (emergent behavior, memory poisoning). Mọi thay đổi tự sinh phải đi qua **eval + sandbox + canary** trước khi vào production.\n\n---\n\n## 8. Áp dụng cho hai bối cảnh\n\n### 8.1. Coding agents (phát triển phần mềm)\nAgent làm *first-pass executor*: phân tích khả thi khi planning, viết feature khi build, mở rộng test coverage khi validate, nêu rủi ro khi review — nén thời gian từ tuần xuống ngắn hơn. Công cụ phổ biến 2026: Claude Code, Cursor, GitHub Copilot Agent, Codex, Gemini Code Assist (đa số đội dùng *kết hợp nhiều công cụ*). Quản trị bằng: PR review bắt buộc, eval-gated CI, test sinh tự động, branch sandbox.\n\n### 8.2. Agent nghiệp vụ (business/ops)\nCùng khung vòng đời, nhưng \"build\" = thực hiện quy trình nghiệp vụ (xử lý đơn, phân loại email, đối soát dữ liệu…). Khác biệt: hành động thường *tác động trực tiếp tới hệ thống thật & tiền*, nên **HITL cho hành động không hoàn tác** và **audit trail** càng quan trọng. Cùng triết lý: đặc tả ý định → eval nhiều lớp → observability → governance.\n\n---\n\n## 9. Lộ trình triển khai (maturity ladder)\n\n```mermaid\nflowchart LR\n    L0[L0 — Hỗ trợ<br/>AI gợi ý, người làm] --> L1[L1 — Agent có giám sát<br/>tự thực thi, duyệt mọi bước rủi ro]\n    L1 --> L2[L2 — Agent bán tự trị<br/>tự thực thi giữa các checkpoint]\n    L2 --> L3[L3 — Vận hành 24/7<br/>observability + error recovery đầy đủ]\n    L3 --> L4[L4 — Tự cải thiện<br/>vòng học khép kín có kiểm soát]\n```\n\n**Thứ tự nên xây (đừng nhảy cóc):**\n1. **Observability trước** — không thấy thì không kiểm soát được. Dựng tracing (OTel) + dashboard 3 tín hiệu.\n2. **Eval suite** — unit + LLM-as-judge + sampling; cắm vào CI làm cổng chất lượng.\n3. **Guardrails & governance** — ánh xạ OWASP, least privilege, HITL theo mức rủi ro.\n4. **Error recovery & orchestration** — retry/fallback/circuit breaker/budget guard cho 24/7.\n5. **Self-improvement** — chỉ bật sau khi 4 lớp trên vững, và luôn qua sandbox + canary.\n\n---\n\n## 10. Checklist \"sản xuất sẵn sàng\" (production-ready)\n\n**Quan sát**\n- [ ] Mọi run sinh trace đầy đủ chuỗi quyết định (OTel GenAI semantic conventions).\n- [ ] Dashboard theo dõi 3 nhóm: chất lượng, chi phí, độ tin cậy.\n- [ ] Alert khi vượt ngưỡng → escalate HITL.\n\n**Đánh giá**\n- [ ] 3 lớp eval: unit (deterministic) + LLM-as-judge regression hằng đêm + sampling production.\n- [ ] Eval-gated CI: chặn release làm tụt điểm.\n- [ ] Meta-evaluate judge; review người hiệu chỉnh trên luồng tác động cao.\n\n**Vận hành 24/7**\n- [ ] Retry+backoff, fallback, circuit breaker, budget/loop guard.\n- [ ] Checkpoint & resume cho nhiệm vụ dài.\n- [ ] Thiết kế cloud-native, memory & state bền vững.\n\n**Kiểm soát & an toàn**\n- [ ] Ánh xạ từng rủi ro OWASP Agentic → guardrail/eval/alert.\n- [ ] Guardrails đầu vào & đầu ra.\n- [ ] Least privilege, scoped credentials, audit trail bất biến.\n- [ ] HITL bắt buộc cho hành động không hoàn tác.\n\n**Tự cải thiện**\n- [ ] Failure analysis tự động từ trace.\n- [ ] Thay đổi tự sinh đi qua sandbox + eval + canary trước production.\n\n---\n\n---\n\n# PHẦN II — Enterprise Agentic Delivery Playbook\n\n> Phần I giải thích nền tảng Agentic SDLC. Phần II chuyển các phản biện thực tế thành **playbook vận hành được** cho phần mềm lớn, nhiều nghiệp vụ, có UI/UX phức tạp và nhiều agent cùng tham gia.\n\n## 11. Đánh giá tổng quan & nguyên lý điều hành\n\nBốn ý kiến phản biện đều đúng, và đều chỉ vào cùng một rủi ro: nếu để agent \"tự hiểu toàn cục\", tự quyết định thiết kế, tự chia module, tự phối hợp với nhau thì chất lượng sẽ dao động mạnh. Agent có thể thực thi nhanh, nhưng không tự nhiên sở hữu được ý định sản phẩm, chuẩn thẩm mỹ, kiến trúc dài hạn, hay logic nghiệp vụ xuyên module.\n\n| Điểm gãy | Đánh giá | Cơ chế kiểm soát bắt buộc |\n|---|---|---|\n| UI/UX agent khó làm chủ | **Rất đúng** | Design system, token, component contract, visual regression, designer checkpoint |\n| Kiến trúc/module nhiều rủi ro | **Phải khóa trước khi build** | SDD, ADR, architecture freeze, debate review, threat modeling |\n| Module lớn dễ rời rạc | **Không giải bằng prompt dài** | Domain boundary, interface contract, `AGENTS.md` phân tầng, contract test, E2E nghiệp vụ |\n| Multi-agent song song dễ xung đột | **Tăng tốc nhưng phải điều phối** | Supervisor, worktree isolation, task ownership, merge gate, trace/cost budget |\n\n**Nguyên lý trung tâm:**\n\n> **Human owns intent, architecture, design standard, contracts; agents own execution inside constraints.**\n\nNói cách khác: con người sở hữu ý định, chuẩn thiết kế, kiến trúc, hợp đồng, quyết định một chiều và tiêu chí chất lượng. Agent chỉ nên thực thi bên trong các ràng buộc đó. Chất lượng không đến từ việc agent \"thông minh hơn\", mà từ việc biến các chuẩn chủ quan thành **nguồn sự thật máy-đọc-được** và **cổng kiểm soát tự động**.\n\n```mermaid\nflowchart LR\n    H[Human-owned<br/>Intent, UX standard, architecture, contracts] --> SOT[Machine-readable sources of truth]\n    SOT --> A[Agent execution<br/>inside constraints]\n    A --> G[Quality gates<br/>tests, evals, reviews]\n    G -->|đạt| M[Merge / ship]\n    G -->|không đạt| F[Fix / escalate]\n    F --> H\n    style H fill:#e3f2fd,stroke:#1565c0\n    style SOT fill:#e8f5e9,stroke:#2e7d32\n    style G fill:#fff3e0,stroke:#e65100\n```\n\n## 12. Quality Control Matrix — nối rủi ro với guardrail\n\n> [!NOTE]\n> Sơ đồ hóa toàn bộ các cổng chất lượng của doanh nghiệp được mô tả chi tiết tại [Bản đồ Cổng Kiểm soát Chất lượng Doanh nghiệp (Sơ đồ 6)](Agentic_SDLC_Master_Map.md#6-bản-đồ-cổng-kiểm-soát-chất-lượng-doanh-nghiệp-enterprise-quality-control-gates-map).\n\nBảng này là lớp điều hành mới cho Phần II: mỗi điểm gãy phải có nguồn sự thật, guardrail tự động, checkpoint con người và tiêu chí pass/fail rõ ràng.\n\n| Khu vực | Nguồn sự thật | Guardrail tự động | Checkpoint con người | Pass/fail |\n|---|---|---|---|---|\n| **UI/UX** | Design tokens, component library, UX guidelines | Token linter, component-only rule, visual regression, accessibility checks | Designer/product review cho thay đổi thị giác lớn | Không hard-code style, không lệch baseline ngoài ngưỡng, đủ responsive/a11y/states |\n| **Architecture** | Spec, ADR, architecture principles, threat model | Dependency rules, architecture tests, security scans, API schema checks | Architect + security + domain lead duyệt trước build | ADR được duyệt, ranh giới rõ, rollback path có, rủi ro chính có mitigation |\n| **Module lớn** | Domain map, interface contracts, data ownership, `AGENTS.md` | Contract tests, integration tests, E2E flows, schema compatibility checks | Domain owner duyệt workflow nghiệp vụ xuyên module | Không phá contract, không nhập nhằng ownership, E2E nghiệp vụ đạt |\n| **Multi-agent** | Task board, ownership map, branch/worktree policy, merge protocol | Isolated worktree, CI per branch, trace/cost/loop guard, merge gate | Supervisor/human lead duyệt phân việc và tích hợp | Không sửa chồng lấn, không merge khi test/eval fail, trace đầy đủ từng agent |\n\n> Quy tắc vận hành: **mỗi rủi ro lớn phải có ít nhất một guardrail máy kiểm được và một checkpoint người duyệt được.** Nếu chỉ có hướng dẫn bằng lời, agent sẽ làm sai khi áp lực ngữ cảnh tăng.\n\n## 13. UI/UX — từ thẩm mỹ chủ quan thành kiểm soát tất định\n\n### 13.1. Rủi ro gốc\n\nUI/UX là vùng agent dễ tạo ra nhiều chỉnh sửa nhất vì \"đẹp\", \"đúng nhịp\", \"đồng nhất\", \"dễ hiểu\" không có một đáp án duy nhất. Agent thường sai ở các điểm: spacing lệch chuẩn, typography không đồng bộ, màu không đúng token, component tự chế, thiếu trạng thái loading/error/empty, responsive vỡ ở breakpoint nhỏ, hoặc một màn hình nhìn ổn nhưng không khớp với hệ thống tổng thể.\n\n### 13.2. Vì sao AI agent dễ sai\n\nAgent nhìn UI qua mô tả rời rạc và ảnh chụp cục bộ, không tự có trí nhớ thị giác đầy đủ về toàn bộ sản phẩm. Nếu không có design system dạng máy-đọc-được, agent sẽ suy diễn từ vài ví dụ và tạo biến thể gần đúng. Kết quả là mỗi màn hình \"hơi khác một chút\"; tích lũy lại thành sản phẩm thiếu đồng nhất.\n\n### 13.3. Quy trình đồng bộ Figma-to-Code toàn diện\nĐể đảm bảo AI Agent tuân thủ giao diện tuyệt đối, quy trình làm việc được cấu trúc thành một chuỗi tự động hóa và checkpoint nghiêm ngặt:\n\n```mermaid\nflowchart TD\n    F[Figma Design Studio] -->|Export variables & styles| Tok[Design Tokens JSON / CSS]\n    F -->|Export layout structure| DSL[Layout Blueprint Schema]\n    Tok & DSL --> AgentInput[Đầu vào của Agent]\n    AgentInput --> AgentCode[Agent viết code giao diện]\n    AgentCode --> Lint[Strict Tailwind/CSS Linter Check]\n    Lint -->|Fail| AgentFixLint[Agent tự sửa lỗi styles]\n    Lint -->|Pass| Evals[Visual QA & Auto-Regression Testing]\n    Evals -->|Lấy mẫu và so sánh screenshot diff > 0.5%| Feedback[Feed image diff + error log cho Agent]\n    Feedback --> AgentCode\n    Evals -->|Pass| HITL[Designer Verification Portal]\n    HITL -->|Từ chối & Comment| AgentCode\n    HITL -->|Duyệt| MasterPR[Merge PR & Deploy]\n```\n\n1. **Bước 1: Token hóa thiết kế (Design Tokenization):**\n   - Màu sắc, khoảng cách (spacing), kiểu chữ (typography), bo góc (border radius), bóng đổ (shadow) được chốt trên Figma.\n   - Sử dụng công cụ (như Figma Variables, Token Studio, Style Dictionary) để biên dịch tự động các biến thiết kế này thành định dạng máy đọc được (`tokens.json` hoặc biến CSS/Tailwind configuration). Các token này là **nguồn sự thật duy nhất** (Single Source of Truth).\n\n2. **Bước 2: Lập sơ đồ cấu trúc layout (Layout Blueprint):**\n   - Thay vì để agent tự thiết kế vị trí các phần tử, sơ đồ Figma được chuyển đổi thành cấu trúc DSL (Domain Specific Language) dạng JSON hoặc HTML skeleton định nghĩa cây phân cấp component, cấu trúc lưới (grid), và responsive breakpoint.\n\n3. **Bước 3: Thực thi của Agent dưới ràng buộc cứng:**\n   - Agent nhận `tokens.json` và Layout Blueprint cùng với danh mục các component đã được xây dựng sẵn.\n   - Áp dụng nguyên tắc **Component-Only Rule**: Agent chỉ được sử dụng các nguyên mẫu component đã chốt trong hệ thống (Button, Input, Card, Modal, v.v.). Nghiêm cấm agent tự viết inline styles hoặc các class CSS tùy tiện ngoài danh mục token cho phép.\n\n4. **Bước 4: Kiểm duyệt mã nguồn tự động (Linting Gate):**\n   - Chạy linter cấu hình nghiêm ngặt (ví dụ: `eslint-plugin-tailwindcss` chặn các class tùy tiện như `h-[123px]`, `w-[54px]`, bắt buộc dùng tokens `h-12`, `w-24`).\n   - Nếu phát hiện mã nguồn cứng (hard-coded hex color `#FF5733` hoặc spacing tùy tiện `margin-top: 13px`), linter sẽ chặn và trả lỗi về cho Agent tự sửa đổi ngay tại sandbox.\n\n5. **Bước 5: Vòng lặp Visual QA & Hồi quy tự động (Automated Visual Regression Loop):**\n   - CI/CD khởi động một headless browser (Playwright/Puppeteer) để render giao diện mới dưới nhiều kích thước màn hình (mobile, tablet, desktop) và các trạng thái (default, hover, active, focus, loading, error, empty).\n   - Tiến hành so sánh ảnh chụp màn hình (screenshot) của giao diện thật với bản thiết kế mẫu được xuất tự động từ Figma API hoặc baseline cũ.\n   - Nếu tỉ lệ khác biệt (diff) vượt quá **0.5%**, hệ thống sẽ tự động ghép ảnh diff màu đỏ, trích xuất mã CSS lỗi và gửi ngược lại cho Agent kèm yêu cầu: *\"Giao diện lệch 3px padding ở góc trên bên phải, hãy sửa lại bằng cách áp dụng token spacing.md\"*. Agent chạy vòng lặp sửa lỗi này tối đa 3 lần.\n\n6. **Bước 6: Cổng xác nhận của Nhà thiết kế (Designer HITL Portal):**\n   - Khi giao diện vượt qua vòng lặp QA tự động, một PR được đẩy lên cổng phê duyệt trực quan.\n   - Nhà thiết kế thực tế (Human Designer) có thể click chọn giữa các trạng thái giao diện (loading, hover, error) để kiểm tra độ mượt mà.\n   - Nếu từ chối, designer để lại feedback dạng hình ảnh và comment. Phản hồi này được chuyển trực tiếp vào Task Brief tiếp theo của Agent.\n\n### 13.4. Các cơ chế kiểm soát tất định (Deterministic Controls)\n\n- **Strict Class Name Allowlist:** Linter cấu hình chỉ cho phép import tokens từ thư viện chỉ định. Mọi cấu trúc CSS tùy biến ngoài config đều bị coi là lỗi compile.\n- **State Matrix Verification:** Bộ test bắt buộc phải trigger tất cả các trạng thái tương tác (`:hover`, `:focus`, `:disabled`) và các kịch bản bất thường (dữ liệu rỗng - empty state, dữ liệu lỗi API - error state) để chụp screenshot kiểm chứng. Không bỏ sót bất kỳ trạng thái nào của giao diện.\n- **Figma API Sync Schema:** Sử dụng ID phần tử Figma làm định danh (Figma Component Key) trong code để liên kết trực tiếp thiết kế Figma với component tương ứng trong mã nguồn, giúp tracking chính xác khi thiết kế thay đổi.\n\n### 13.5. Tiêu chí pass/fail\n\n- **Pass:** Không hard-code style, 100% styles sử dụng token, vượt qua linter Tailwind/CSS, screenshot diff dưới 0.5% ở tất cả 3 viewports và 5 trạng thái tương tác, được ký duyệt (sign-off) bởi Designer trên cổng HITL.\n- **Fail:** Tự định nghĩa class mới, dùng hex color trực tiếp, lệch spacing token, vỡ layout responsive, thiếu trạng thái lỗi/tải (error/loading), hoặc visual diff vượt quá 0.5% mà chưa có phê duyệt ngoại lệ của Designer.\n\n### 13.6. Checklist triển khai UI/UX\n\n- [ ] Figma variables được đồng bộ tự động thành file tokens cấu hình trong dự án.\n- [ ] Linter cài đặt rules chặn cứng inline-style và các class CSS tự do (non-token).\n- [ ] Cấu hình visual regression test tự động trên CI (Playwright/Chromatic/Percy) tích hợp vòng phản hồi (feedback loop) cho Agent.\n- [ ] Xây dựng ma trận kiểm tra đầy đủ trạng thái (default, hover, active, focus, loading, error, empty) cho mọi component mới.\n- [ ] Thiết lập cổng HITL Designer Review Sign-off bắt buộc làm Gate cuối cùng trước khi merge PR.\n\n## 14. Kiến trúc — khóa quyết định lớn trước khi agent build\n\n### 14.1. Rủi ro gốc\n\nKiến trúc là nhóm quyết định có chi phí sửa sai rất cao. Một module boundary sai, data ownership mơ hồ, dependency ngược chiều, hoặc lựa chọn storage/eventing sai có thể làm toàn bộ hệ thống khó mở rộng sau này. Agent thường tối ưu để hoàn thành task trước mắt, nên dễ chọn giải pháp cục bộ mà không thấy hệ quả dài hạn.\n\n### 14.2. Vì sao AI agent dễ sai\n\nAgent bị giới hạn bởi context hiện có và mục tiêu ngắn hạn trong prompt. Nếu prompt yêu cầu \"implement feature\", agent sẽ ưu tiên code chạy được, đôi khi bỏ qua reversibility, migration path, operational cost, security boundary hoặc khả năng test. Vì vậy kiến trúc phải là **đầu vào đã duyệt**, không phải kết quả phụ trong lúc coding.\n\n### 14.3. Cơ chế kiểm soát: Architecture Freeze Before Agent Build\n\nTrước khi agent implement, phải có cổng **Architecture Freeze Before Agent Build**. \"Freeze\" không có nghĩa là không bao giờ đổi, mà là mọi quyết định kiến trúc quan trọng đã được ghi lại, phản biện, duyệt và có đường quay lại nếu giả định sai.\n\n```mermaid\nflowchart LR\n    S[Spec hành vi] --> A[Architecture proposal]\n    A --> ADR[ADR + alternatives + consequences]\n    ADR --> DB[Debate review<br/>architect, security, scale, cost, domain]\n    DB -->|đạt| FR[Architecture freeze]\n    DB -->|chưa đạt| A\n    FR --> T[Task breakdown]\n    T --> I[Agent implementation]\n    I --> G[Architecture guardrails<br/>dependency, schema, security, tests]\n    G -->|vi phạm| I\n    G -->|đạt| PR[PR review]\n    style FR fill:#e8f5e9,stroke:#2e7d32\n    style DB fill:#fff3e0,stroke:#e65100\n```\n\nMẫu ADR tối thiểu:\n\n| Mục | Nội dung bắt buộc |\n|---|---|\n| **Context** | Vấn đề, ràng buộc, yêu cầu phi chức năng, giả định |\n| **Decision** | Quyết định được chọn và phạm vi áp dụng |\n| **Alternatives** | Các phương án bị loại và lý do |\n| **Consequences** | Tác động tới scale, cost, security, testability, vận hành |\n| **Rollback path** | Cách đảo quyết định hoặc giảm thiệt hại nếu sai |\n\n### 14.4. Review đa vai\n\nMỗi quyết định kiến trúc quan trọng nên được phản biện bởi các vai sau, có thể là người thật hoặc agent đóng vai, nhưng người chịu trách nhiệm cuối phải là architect/human lead:\n\n- **Architect:** ranh giới module, coupling, dependency direction, extensibility.\n- **Security:** threat model, privilege boundary, data exposure, audit trail.\n- **Scalability:** throughput, latency, state, queueing, cache, bottleneck.\n- **Maintainability:** cognitive load, testability, migration, versioning.\n- **Cost:** chi phí hạ tầng, token/tool calls, vận hành 24/7.\n- **Domain expert:** logic nghiệp vụ, exception flow, compliance, thuật ngữ.\n\n### 14.5. Tiêu chí pass/fail\n\n- Pass nếu spec rõ, ADR được duyệt, module boundary và data ownership rõ, dependency direction kiểm được, threat model có mitigation, rollback path tồn tại, test strategy gắn với kiến trúc.\n- Fail nếu agent phải tự quyết định storage, event schema, API boundary, permission model, hoặc dependency giữa module trong lúc implement.\n\n### 14.6. Checklist triển khai kiến trúc\n\n- [ ] Spec được duyệt trước khi lập task.\n- [ ] ADR tồn tại cho mọi quyết định khó đảo.\n- [ ] Architecture review đa vai hoàn tất.\n- [ ] Dependency rules hoặc architecture tests nằm trong CI.\n- [ ] Threat model và quyền hạn được ánh xạ sang guardrail.\n- [ ] Không giao task implement khi boundary/interface còn mơ hồ.\n\n## 15. Module lớn — chia nhỏ theo domain mà không mất logic\n\n### 15.1. Rủi ro gốc\n\nVới phần mềm lớn, nhiều nghiệp vụ, rủi ro không nằm ở việc agent viết được từng mảnh code hay không. Rủi ro nằm ở việc các mảnh đó không khớp với nhau: cùng một khái niệm nghiệp vụ bị định nghĩa khác nhau, dữ liệu có nhiều owner, workflow đứt ở biên module, lỗi không được propagate đúng, hoặc thay đổi một module làm vỡ module khác mà test đơn vị không bắt được.\n\n### 15.2. Vì sao AI agent dễ sai\n\nKhông một prompt đơn lẻ nào giữ được toàn bộ bức tranh của hệ thống lớn. Nếu chia task theo màn hình hoặc theo file kỹ thuật, agent có thể tối ưu từng phần nhưng làm mất logic domain. Cách chia đúng là chia theo **bounded context/domain capability**, sau đó khóa bằng contract.\n\n### 15.3. Cơ chế kiểm soát: domain boundary + interface contract\n\nMỗi module lớn phải có contract rõ trước khi agent sửa code. Contract không chỉ là API endpoint; nó là hợp đồng vận hành giữa các phần của hệ thống.\n\n```mermaid\nflowchart TB\n    DM[Domain map<br/>bounded contexts] --> IC[Interface contracts<br/>API, schema, event, errors]\n    IC --> AG[AGENTS.md phân tầng]\n    AG --> M1[Module A implementation]\n    AG --> M2[Module B implementation]\n    AG --> M3[Module C implementation]\n    M1 --> CT[Contract tests]\n    M2 --> CT\n    M3 --> CT\n    CT --> IT[Integration tests]\n    IT --> E2E[E2E nghiệp vụ]\n    E2E -->|đạt| OK[Ready to merge]\n    E2E -->|fail| FIX[Fix boundary or implementation]\n    style DM fill:#e3f2fd,stroke:#1565c0\n    style IC fill:#e8f5e9,stroke:#2e7d32\n    style CT fill:#fff3e0,stroke:#e65100\n```\n\nMột module contract tối thiểu cần có:\n\n- **Domain responsibility:** module sở hữu năng lực nghiệp vụ nào, không sở hữu gì.\n- **API/schema/event:** đầu vào, đầu ra, versioning, backward compatibility.\n- **Data ownership:** bảng/collection/entity nào thuộc module, ai được ghi, ai chỉ được đọc.\n- **Error model:** lỗi nghiệp vụ, lỗi kỹ thuật, retryability, idempotency.\n- **Security boundary:** quyền cần có, dữ liệu nhạy cảm, audit requirement.\n- **Test contract:** consumer-driven contract tests, integration tests, E2E flows liên quan.\n\n### 15.4. `AGENTS.md` phân tầng như bản đồ vận hành cho agent\n\n`AGENTS.md` nên phản chiếu cấu trúc hệ thống:\n\n- Repo root: nguyên tắc toàn cục, coding standard, test command, security rules.\n- Domain/module: mục tiêu nghiệp vụ, boundary, contract, thuật ngữ, dependency allowed/forbidden.\n- Package/submodule: hướng dẫn local, test cụ thể, convention, known pitfalls.\n\nAgent đọc file gần phạm vi đang sửa nhất, nhưng vẫn bị ràng buộc bởi nguyên tắc ở cấp cao hơn. Đây là cách giữ ngữ cảnh đủ nhỏ để agent xử lý, nhưng vẫn không mất liên kết toàn cục.\n\n### 15.5. Tiêu chí pass/fail\n\n- Pass nếu mỗi module có owner, boundary, contract, test và E2E flow rõ; thay đổi module không phá consumer; thuật ngữ nghiệp vụ dùng nhất quán.\n- Fail nếu task chỉ ghi \"làm màn hình X\" mà không xác định domain owner, data owner, contract, error flow, hoặc E2E nghiệp vụ.\n\n### 15.6. Checklist triển khai module lớn\n\n- [ ] Có domain map/bounded context trước khi chia task.\n- [ ] Mỗi module có contract về API/schema/event/data/error/security.\n- [ ] `AGENTS.md` tồn tại ở root và module quan trọng.\n- [ ] Contract tests chạy ở mọi biên module.\n- [ ] E2E flows đại diện cho nghiệp vụ thật, không chỉ test kỹ thuật.\n- [ ] Mỗi bug production tạo thêm một test/eval hồi quy.\n\n## 16. Multi-agent — song song tốc độ cao nhưng không mất kiểm soát\n\n### 16.1. Rủi ro gốc\n\nMulti-agent tăng tốc vì nhiều luồng thực thi chạy cùng lúc, nhưng cũng nhân rủi ro: hai agent sửa cùng file, hai cách hiểu khác nhau về cùng một contract, test bị viết trùng hoặc hở, style lệch giữa nhánh, chi phí tăng nhanh, và merge cuối cùng trở thành điểm nghẽn.\n\n### 16.2. Vì sao AI agent dễ sai\n\nMỗi agent có context riêng và tối ưu cho task riêng. Nếu không có supervisor, ownership map và merge protocol, các agent sẽ tạo ra nhiều lời giải cục bộ nhưng khó tích hợp. Song song chỉ có giá trị khi các ranh giới đã rõ và chất lượng được kiểm ở điểm hợp nhất.\n\n### 16.3. Kiến trúc Multi-Agent hướng Domain song song (Domain-Driven Multi-Agent - DDMA)\n\nĐể tăng tốc độ phát triển cho phần mềm nhiều nghiệp vụ, hệ thống phức tạp mà vẫn bảo đảm tính đồng bộ logic và ranh giới hệ thống, chúng tôi áp dụng kiến trúc DDMA.\n\n```mermaid\nflowchart TB\n    SUP[Supervisor Agent] -->|Phân rã & gán Task theo Domain| Map[Task Ownership Map]\n    \n    Map -->|Cách ly Worktree| AgentA[Coding Agent A - Domain Khách Hàng]\n    Map -->|Cách ly Worktree| AgentB[Coding Agent B - Domain Hóa Đơn]\n    \n    AgentA <-->|Thống nhất Contract trước| SharedContract[(API Spec / Event Schema Registry)]\n    AgentB <-->|Thống nhất Contract trước| SharedContract\n    \n    subgraph ExecutionA[Nhánh A - Sandbox A]\n        AgentA --> CodeA[Code Domain A]\n        CodeA --> PactA[Contract Tests & Unit tests]\n    end\n    \n    subgraph ExecutionB[Nhánh B - Sandbox B]\n        AgentB --> CodeB[Code Domain B]\n        CodeB --> PactB[Contract Tests & Unit tests]\n    end\n    \n    PactA & PactB --> CI[CI Integration Gate]\n    CI -->|Xung đột API / Test Fail| Debate[Agentic Debate Protocol - Tranh biện tự động]\n    Debate -->|Tự điều chỉnh spec thành công| CI\n    Debate -->|Thất bại 3 vòng| Human[Tech Lead HITL Checkpoint]\n    CI -->|Pass E2E & Contracts| Merge[Master Merge Gate]\n```\n\n#### 16.3.1. Nguyên tắc cách ly không gian làm việc (Workspace Isolation)\n- **Domain Bound Worktrees:** Mỗi agent làm việc trên một nhánh git và Git Worktree hoàn toàn cô lập.\n- **File Access Lock:** Phân quyền sửa đổi tệp dựa trên cấu trúc thư mục của Bounded Context (DDD). Agent phụ trách domain *Hóa Đơn* bị cấm tuyệt đối bởi git pre-commit hook không cho phép sửa đổi mã nguồn nằm trong thư mục của domain *Khách Hàng*.\n- **Database Schema Lock:** Database schema được cố định trước khi phân công. Agent không được tự ý sửa database schema khi chưa có migration file được duyệt trước bởi Architect (Con người).\n\n#### 16.3.2. Cơ chế Contract-First và Khóa Tích hợp (Integration Lock)\n- **API & Event Specs as Hard Gates:** Trước khi thực thi viết logic, các sub-agents bắt buộc phải giao tiếp thông qua một registry chung để thống nhất interface: API Spec (OpenAPI/GraphQL/Protobuf) hoặc Event Schema (Avro/JSON Schema).\n- **Consumer-Driven Contract Testing (Pact):** Mọi thay đổi ở client hoặc server đều phải chạy qua bộ kiểm thử contract. Nếu domain A thay đổi kiểu dữ liệu trả về của một trường làm ảnh hưởng đến domain B, Pact test sẽ lập tức báo đỏ và chặn merge.\n\n#### 16.3.3. Cơ chế tự động giải quyết xung đột (Agentic Debate Protocol)\nKhi phát hiện xung đột hoặc lỗi kiểm thử contract giữa hai domain chạy song song:\n1. **Khởi chạy Nghị trình Tranh biện (Start Debate):** Agent Supervisor sẽ tự động khóa hai nhánh và kéo hai Agent liên quan vào một phiên chat nội bộ (Debate Room).\n2. **Đối thoại Spec (Context Sharing):** Supervisor cung cấp chi tiết lỗi test Pact, log lỗi, và specs hiện tại của hai bên.\n3. **Căn chỉnh tự động (Auto-Reconciliation):** Các sub-agents sẽ đưa ra lý do, đề xuất chỉnh sửa schema hoặc đổi tên trường dữ liệu. Quy trình này lặp lại tối đa 3 vòng.\n4. **Phê duyệt hoặc Leo thang (Escalation):** Nếu tự căn chỉnh thành công và test pass, Supervisor ghi nhận spec mới và tiếp tục chạy CI. Nếu sau 3 vòng vẫn xung đột logic nghiệp vụ sâu, Supervisor sẽ đóng băng task và gửi cảnh báo đỏ lên Technical Lead (Con người) để phân xử.\n\n### 16.4. Phân vai Claude, Codex, Gemini\n\n| Công cụ | Vai trò phù hợp | Không nên giao |\n|---|---|---|\n| **Claude** | Reasoning sâu, kiến trúc, phản biện, planning, review chất lượng, điều phối Debate Room | Tự ý quyết kiến trúc nếu chưa có human approval |\n| **Codex** | Implementation, refactor có phạm vi rõ, viết test, sửa lỗi cục bộ trong Sandbox | Tự mở rộng scope hoặc sửa chồng lấn nhiều module |\n| **Gemini** | Đọc ngữ cảnh lớn, phân tích tài liệu/codebase rộng, đa phương thức, kiểm tra sự đồng nhất logic toàn cục | Merge cuối hoặc quyết định contract khi chưa được duyệt |\n\n### 16.5. Quy trình song song an toàn\n\n1. **Khóa Spec & Contract trước:** Xác định API/Event spec và lưu vào Schema Registry.\n2. **Lập Task Ownership Map:** Phân định rõ ranh giới thư mục hoạt động cho từng Agent.\n3. **Phân phối Isolated Worktrees:** Kích hoạt các agent thực thi độc lập trên sandbox.\n4. **Chạy Contract Tests trên từng Branch:** Đảm bảo nhánh riêng luôn xanh với contract chung.\n5. **Kích hoạt Agentic Debate:** Khi có xung đột API, tự động đối thoại để sửa đổi spec.\n6. **Master Merge Gate:** Con người (Tech Lead) duyệt PR chỉ khi 100% unit tests, contract tests, và E2E nghiệp vụ thành công.\n\n### 16.6. Tiêu chí pass/fail\n\n- **Pass:** Mỗi agent đi đúng domain boundary, không sửa file ngoài danh mục phân quyền, 100% Contract Tests và Integration Tests đạt yêu cầu, giải quyết xung đột qua Debate Room thành công hoặc được Tech Lead ký duyệt.\n- **Fail:** Tự sửa mã nguồn của domain khác, thay đổi database schema ngoài kế hoạch, không qua được Pact test, hoặc xảy ra xung đột API mà không giải quyết được và trôi nổi không báo cáo.\n\n### 16.7. Checklist triển khai multi-agent\n\n- [ ] Có supervisor/human lead chịu trách nhiệm phân việc và merge.\n- [ ] Thiết lập Git pre-commit hooks chặn sửa đổi tệp ngoài domain boundary được gán.\n- [ ] Chốt toàn bộ API/Event contracts trước khi chia nhánh cho agents.\n- [ ] Cài đặt framework Contract Testing (như Pact) tích hợp vào luồng CI của từng nhánh.\n- [ ] Cấu hình Agentic Debate Protocol tự động giải quyết xung đột giao tiếp API.\n- [ ] Merge chỉ sau khi tất cả các kiểm thử unit, contract, integration và E2E đều đạt chỉ số xanh.\n\n## 17. Checklist enterprise sau khi bổ sung Phần II\n\n**UI/UX**\n- [ ] Agent không tạo UI ngoài design system nếu chưa có approval.\n- [ ] Token, component, visual regression, accessibility, responsive checks đều có trong pipeline.\n- [ ] Designer checkpoint áp dụng cho layout/component/interaction mới.\n\n**Kiến trúc**\n- [ ] Architecture Freeze Before Agent Build được áp dụng cho quyết định lớn.\n- [ ] ADR có context, decision, alternatives, consequences, rollback path.\n- [ ] Review đa vai bao gồm architect, security, scalability, maintainability, cost, domain expert.\n\n**Module lớn**\n- [ ] Chia theo bounded context/domain capability, không chỉ theo màn hình.\n- [ ] Mỗi module có contract về API/schema/event/data ownership/error model/security.\n- [ ] `AGENTS.md` phân tầng giúp agent giữ đúng ngữ cảnh local và nguyên tắc global.\n\n**Multi-agent**\n- [ ] Supervisor + isolated sub-agents là mô hình mặc định.\n- [ ] Claude/Codex/Gemini được phân vai theo điểm mạnh, không dùng thay human approval.\n- [ ] Worktree isolation, ownership map, CI per branch và merge gate là bắt buộc.\n\n> **Ba nguyên tắc vàng sau khi nâng cấp tài liệu:**\n> 1. *Con người sở hữu intent, architecture, design standard, contracts; agent sở hữu execution trong ràng buộc.*\n> 2. *Biến chuẩn chủ quan thành guardrail máy kiểm được: token, component contract, screenshot diff, ADR, contract test, eval.*\n> 3. *Tốc độ multi-agent chỉ có giá trị khi tích hợp được; tích hợp được nhờ boundary, ownership, isolation và merge gate.*\n\n---\n\n## Nguồn tham khảo\n\n- [Agentic SDLC: How AI agents are changing SDLC — CodeRabbit](https://www.coderabbit.ai/guides/agentic-sdlc)\n- [Agentic SDLC: What Changes When Agents Run Development — Augment Code](https://www.augmentcode.com/guides/agentic-sdlc)\n- [Agentic Development Lifecycle (ADLC): A New Model Beyond SDLC — EPAM](https://www.epam.com/insights/ai/blogs/agentic-development-lifecycle-explained)\n- [How agentic AI will reshape engineering workflows in 2026 — CIO](https://www.cio.com/article/4134741/how-agentic-ai-will-reshape-engineering-workflows-in-2026.html)\n- [An AI-led SDLC: End-to-End Agentic SDLC with Azure and GitHub — Microsoft Community Hub](https://techcommunity.microsoft.com/blog/appsonazureblog/an-ai-led-sdlc-building-an-end-to-end-agentic-software-development-lifecycle-wit/4491896)\n- [Agentic AI Software Development Lifecycle: Secure ADLC Playbook — Codebridge](https://www.codebridge.tech/articles/agentic-ai-software-development-lifecycle-the-production-ready-playbook)\n- [What is Agentic SDLC — Sonar](https://www.sonarsource.com/resources/library/what-is-agentic-sdlc/)\n- [State of AI Agents 2026: Governance, Evaluation and Scale — Lovelytics](https://lovelytics.com/post/state-of-ai-agents-2026-lessons-on-governance-evaluation-and-scale/)\n- [Agent observability: The complete guide for 2026 — Braintrust](https://www.braintrust.dev/articles/agent-observability-complete-guide-2026)\n- [Agent Observability 2026: Evals, Traces, Cost Guide — Digital Applied](https://www.digitalapplied.com/blog/agent-observability-2026-evals-traces-cost-guide)\n- [Best AI Observability Tools for Autonomous Agents in 2026 — Arize](https://arize.com/blog/best-ai-observability-tools-for-autonomous-agents-in-2026/)\n- [Running Automated Evals for AI Agents — DEV Community](https://dev.to/kuldeep_paul/running-automated-evals-for-ai-agents-a-practical-guide-for-engineering-and-product-teams-3pb8)\n- [Agentic AI evaluation strategies — Vector Institute](https://vectorinstitute.ai/agentic-ai-evaluation-strategies/)\n- [Evaluating AI agents: Real-world lessons at Amazon — AWS](https://aws.amazon.com/blogs/machine-learning/evaluating-ai-agents-real-world-lessons-from-building-agentic-systems-at-amazon/)\n- [Agent-as-a-Judge: Evaluate Agents with Agents — arXiv](https://arxiv.org/pdf/2410.10934)\n- [OWASP Top 10 for Agentic Applications 2026 — DeepTeam / Confident AI](https://www.trydeepteam.com/docs/frameworks-owasp-top-10-for-agentic-applications)\n- [OWASP Top 10 Agents & AI Vulnerabilities (2026 Cheat Sheet)](https://blog.alexewerlof.com/p/owasp-top-10-ai-llm-agents)\n- [Self-Improving AI Agents: The 2026 Guide — o-mega](https://o-mega.ai/articles/self-improving-ai-agents-the-2026-guide)\n- [Top 5 AI Agent Monitoring Platforms in 2026 — Maxim AI](https://www.getmaxim.ai/articles/top-5-ai-agent-monitoring-platforms-in-2026/)\n"
